        description: '旗艦級頂配體驗：語音雙向識別、視覺分析、桌面監控、主動感知、藝術創作、外部工具與四象限記憶。'
      quiet:
        title: 靜默觀察者
        badge: ⚡ 極速 · 極簡主義
        subtitle: 文字、工具與記憶
        description: 零音訊開銷，具備舞台化身表情、思考節奏與長期記憶的輕量級文字夥伴。
