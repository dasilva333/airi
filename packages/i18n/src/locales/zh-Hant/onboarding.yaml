      badge: 離線優先
      title: 本機夥伴 (完全隔離)
      description: 100% 離線與隱私保護。所有角色卡、記憶與狀態均保存在本機資料庫中，絕無雲端遙測通訊。
      selectedCta: 已選擇 (離線模式)
      selectCta: 選擇本機模式
      features:
        f1: 裝置內 100% 離線儲存
        f2: 零雲端遙測與外部網路請求
        f3: 基於本機資料庫極速秒開
      continueAction: Continue locally
      noSignInNeeded: No sign-in needed.
      bullets:
        storage:
          title: On-device storage
          desc: Data stays in your local database.
        account:
          title: No account required
          desc: Start without signing in.
        setup:
          title: Simple local setup
          desc: Manage your companion on this device.
      details:
        storage:
          title: On-Device Database Storage
          desc: All companion cards, transcripts, and memory journals are stored strictly
            in your local IndexedDB and disk vaults. Zero data ever leaves your
            computer.
        telemetry:
          title: Zero Telemetry & Custody
          desc: No accounts, no email addresses, no tracking cookies, and no telemetry
            pingbacks. Complete anonymity and zero-custody data sovereignty.
          badge: 100% Air-Gapped
        compute:
          title: Bring-Your-Own Compute
          desc: Run Kokoro TTS, Whisper STT, and Ollama / LM Studio / WebLLM completely
            offline using your device’s local CPU and GPU acceleration.
          badge: WebGPU & Local LLM
        export:
          title: Portable Open Formats
          desc: Export your companions and memories anytime as standard PNG chunks or raw
            JSON. No proprietary format lock-in or cloud dependencies.
          badge: CCv3 / PNG Chunks
        architectureTitle: Air-Gapped Local Architecture
        architectureDescription: 100% on-device execution. Your companion stays
          completely private to this machine.
    cloud:
      badge: 10 GB 免費 + 雲端同步
      title: 帳號登入 (Cloudflare)
      description: 連接您的帳號以解鎖 10 GB 免費儲存空間、每日邊緣 AI 額度，以及跨裝置 24/7 伴侶在線。
      selectedCta: 已選擇 (雲端備份)
      selectCta: 選擇雲端同步
      features:
        f1: 10 GB 免費雲端儲存空間
        f2: 每日免費邊緣 AI 額度
        f3: 24/7 Discord 雲端接力
        f4: 多裝置同步與一鍵復原
        f5: 私有 CORS 代理與零託管隱私
        storage:
          title: 10 GB 免費雲端儲存空間
          desc: 完整備份 3D 模型、自訂背景與記憶庫，且無下載流量費用。
          howItWorks: 基於使用者擁有的 Cloudflare R2 物件儲存技術。
          whyItMatters: 永久免費空間充裕，容納數十個 VRM/Live2D 模型與數年對話歷史。與 AWS S3 不同，下載資產 100% 免收出網流量費。
        ai:
          title: 每日免費邊緣 AI 額度
          desc: 每日 10,000 免費 Neurons 額度，支援 DeepSeek、Qwen 與 Llama（無需 API 金鑰）。
          howItWorks: 在步驟 8（意識）中自動直連 Cloudflare Workers AI。
          whyItMatters: 無需 OpenAI 付費訂閱、綁定信用卡或高階本機顯示卡，即可在邊緣直接暢聊前沿開源大模型。
        relay:
          title: 24/7 Discord 雲端接力
          desc: 即使電腦關機或休眠，伴侶也能在你的專屬 Discord 伺服器中保持清醒。
          howItWorks: 作為無伺服器 Cloudflare Worker (@proj-airi/stage-edge) 運行並處理 Discord 互動
            Webhook。
          whyItMatters: 伴侶全天候回應 Discord 訊息並在邊緣保存記憶，當你再次打開電腦時自動回傳同步。
        sync:
          title: 多裝置同步與一鍵復原
          desc: 順暢同步桌面端、Web 端與行動端；隨時一鍵完整復原伴侶。
          howItWorks: 透過 Edge Key Vault (airi-edge-vault) 安全保持伴侶最新活躍狀態。
          whyItMatters: 重裝 AIRI 或更換新設備時，無需重新設定金鑰即可秒速復原伴侶、設定與所有記憶。
        proxy:
          title: 私有 CORS 代理與零託管隱私
          desc: 安全存取複雜的本機與遠端 AI API，100% 零資料截留。
          howItWorks: 自動部署個人邊緣反向代理，為 Web 與行動端繞過瀏覽器 CORS 跨域限制。
          whyItMatters: 所有資料只存在於你自己的 Cloudflare 帳號中，AIRI 沒有任何中轉伺服器，絕不窺探或收集你的對話。
      signInAction: Sign in & continue
      signInHelp: Sign in with Cloudflare to continue.
