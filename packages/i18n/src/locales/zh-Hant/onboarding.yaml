        description: 即時語音轉寫(STT)、情感語音合成(TTS)、聊天圖片感知、自然交流節奏與記憶。
      muse:
        title: 靈感繆斯
        badge: 🎨 視覺焦點
        subtitle: 語音、視覺與藝術創作
        description: 語音對話、圖像生成(Pollinations/ComfyUI)、圖片理解與豐富的化身變形。
      copilot:
