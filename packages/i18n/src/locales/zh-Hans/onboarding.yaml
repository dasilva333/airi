          title: 设备本地数据库存储
          desc: 所有伙伴卡片、对话记录和记忆日志均保存在本地 IndexedDB 和磁盘存储中。数据不会离开你的电脑。
        telemetry:
          title: 无遥测与数据托管
          desc: 无需账户、邮箱地址，不使用跟踪 Cookie 或遥测回传。完全匿名，数据自主掌控，无需托管给第三方。
