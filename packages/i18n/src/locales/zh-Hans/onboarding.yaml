          title: 使用自己的计算资源
          desc: 使用设备本地 CPU 和 GPU 加速，完全离线运行 Kokoro TTS、Whisper STT 以及 Ollama / LM Studio /
            WebLLM。
          badge: WebGPU 与本地语言模型
        export:
          title: 便于迁移的开放格式
          desc: 随时以标准 PNG 数据块或原始 JSON 格式导出伙伴和记忆，不受专有格式或云服务依赖的限制。
          badge: CCv3 / PNG 数据块
        architectureTitle: 离线隔离的本地架构
        architectureDescription: 完全在设备本地运行。伙伴数据仅保存在此设备中。
    cloud:
      badge: 10 GB 免费空间 + 云端同步
      title: 连接账户
      description: 由 Cloudflare 提供支持 · 使用账户进行备份、同步并访问托管服务。
      selectedCta: 已选择 (云端备份)
      selectCta: 选择云端同步
      features:
        f1: 10 GB 免费云存储空间
        f2: 每日免费边缘 AI 算力
        f3: 24/7 Discord 云端接力
        f4: 多设备同步与一键恢复
        f5: 私有 CORS 代理与零托管隐私
        storage:
          title: 10 GB 免费对象存储
          desc: 完整备份 3D 模型、自定义背景与记忆库，且无下载流量费用。
          howItWorks: 基于用户拥有的 Cloudflare R2 对象存储技术。
          whyItMatters: 提供充足的免费额度，且无流出流量费用。可跨设备安全备份 3D/VRM 形象、Live2D 资源、自定义背景和完整记忆层级。
        ai:
          title: 每日 10,000 免费边缘 AI 额度
          desc: 每日 10,000 免费 Neurons 额度，支持 DeepSeek、Qwen 与 Llama（无需 API 密钥）。
          howItWorks: 在步骤 8（意识）中自动直连 Cloudflare Workers AI。
          whyItMatters: 直接连接 Cloudflare 全球边缘 GPU 集群，无需付费 API 密钥或独立显卡，即可使用 DeepSeek-R1、Qwen
            2.5 和 Llama 3 聊天。
        relay:
          title: 全天候 Discord 无服务器中继
          desc: 即使电脑关机或休眠，伴侣也能在你的专属 Discord 服务器中保持清醒。
          howItWorks: 作为无服务器 Cloudflare Worker ({'@'}proj-airi/stage-edge) 运行并处理 Discord
            交互 Webhook。
          whyItMatters: 无服务器 Cloudflare Worker 让伙伴在 Discord 服务器中全天候在线，并在重新打开 AIRI 时将对话同步回桌面。
        sync:
          title: 多设备同步与一键恢复
          desc: 顺畅同步桌面端、Web 端与移动端；随时一键完整恢复伴侣。
          howItWorks: 通过 Edge Key Vault (airi-edge-vault) 安全保持伴侣最新活跃状态。
          whyItMatters: 加密的 Edge Key Vault 安全同步桌面、网页和移动端伙伴，让你在新设备上即时一键恢复。
        proxy:
          title: 私有 CORS 代理与零托管隐私
          desc: 安全访问复杂的本地与远程 AI API，100% 零数据截留。
          howItWorks: 自动部署个人边缘反向代理，为 Web 与移动端绕过浏览器 CORS 跨域限制。
          whyItMatters: 部署个人边缘反向代理，让网页和 Pocket 移动端绕过浏览器 CORS 限制。所有服务都在你的个人账户中运行。
      signInAction: 登录并继续
      signInHelp: 使用 Cloudflare 登录以继续。
