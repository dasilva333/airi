  experience:
    label: 体验
    subtitle: 交互原型
    title: 交互原型定制
    description: 选择预设的伴侣体验原型。系统将根据你的偏好动态裁剪不需要的模块与配置步骤。
    archetypes:
      quietObserver:
        title: 静默观察者
        tag: 极速 · 极简主义
        description: 超低开销的文字伴侣。舞台形象生动反应、拥有深邃内心想法与长期记忆，无任何音频或视觉系统负担。
      casualCompanion:
        title: 日常伙伴
        tag: 热门推荐
        description: 经典的全能语音与视觉伴侣。自然流畅的声音对话 (STT/TTS)、聊天识图 (VLM)、真实停顿节奏与长期记忆。
      creativeMuse:
        title: 创作缪斯
        tag: 视觉艺术聚焦
        description: 伴侣灵感画室。支持语音交流、自主视觉生图 (Pollinations/ComfyUI)、图片理解与细腻的动作表情映射。
      executiveCopilot:
        title: 智能副驾
        tag: 高效生产力
        description: 专注办公协作。全语音对话、桌面窗口感知、历史应用追踪、本地文件系统 MCP 工具及实时联网搜索。
      ambientRoommate:
        title: 氛围室友
        tag: 主动陪伴日常
        description: 拥有生活起居习惯的伴侣。自然语音、环境心跳主动搭话、作息静音时段与屏幕观察能力。
      swissArmy:
        title: 全能旗舰
        tag: 步骤完整 · 应有尽有
        description: 旗舰级顶配体验：语音双向识别、视觉分析、桌面监控、主动感知、艺术创作、外部工具与四象限记忆。
      quiet:
        title: 静默观察者
        badge: ⚡ 极速 · 极简主义
        subtitle: 文本、表情与记忆
        description: 零音频开销，具备舞台化身表情、思考节奏与长期记忆的轻量级文本伴侣。
      casual:
        title: 日常伴侣
        badge: ✨ 热门之选
        subtitle: 语音对话与视觉感知
        description: 实时语音转写(STT)、情感语音合成(TTS)、聊天图片感知、自然交流节奏与记忆。
      muse:
        title: 灵感缪斯
        badge: 🎨 视觉焦点
        subtitle: 语音、视觉与艺术创作
        description: 语音对话、图像生成(Pollinations/ComfyUI)、图片理解与丰富的化身变形。
      copilot:
        title: 高效副驾驶
        badge: 💼 生产力助手
        subtitle: 语音 + 行动工具
        description: 语音对话、桌面屏幕观察、本地文件系统 MCP 工具与实时网络搜索。
      roommate:
        title: 日常室友
        badge: 🌙 主动陪伴
        subtitle: 生活作息与常驻存在
        description: 语音交流、环境心跳、就寝作息、免打扰时段与屏幕感知。
      swiss-army:
        title: 全能瑞士军刀
        badge: 🔥 全功能 · 一应俱全
        subtitle: 全功能自主多模态
        description: 旗舰级全能数字伴侣。听觉、神经语音、思考节奏、双阶段ACT表情、屏幕观察、艺术生成与认知记忆层级。
    advanced:
      toggle: '高级：自定义各个模块开关'
      description: 手动启用或禁用特定的感官与认知能力模块。
      modules:
        hearing: 听觉 (麦克风语音转文字)
