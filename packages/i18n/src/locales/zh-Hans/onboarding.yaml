        description: 实时语音转写(STT)、情感语音合成(TTS)、聊天图片感知、自然交流节奏与记忆。
      muse:
        title: 灵感缪斯
        badge: 🎨 视觉焦点
        subtitle: 语音、视觉与艺术创作
        description: 语音对话、图像生成(Pollinations/ComfyUI)、图片理解与丰富的化身变形。
      copilot:
        title: 高效副驾驶
        badge: 💼 生产力助手
        subtitle: 语音 + 行动工具
        description: 语音对话、桌面屏幕观察、本地文件系统 MCP 工具与实时网络搜索。
      roommate:
