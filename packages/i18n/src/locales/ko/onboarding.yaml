steps:
  welcome:
    label: 시작
    subtitle: 프라이빗 컴패니언 스튜디오
    heroTitle: AIRI에 오신 것을 환영합니다
    heroSubtitle: 나만의 디지털 컴패니언 무대 —— 단 몇 분 만에 설정하고 100% 로컬 머신에서 안전하게 실행하세요.
    companionQuote: 안녕하세요! 저는 당신의 자율형 디지털 컴패니언입니다. 음성 대화, 풍부한 무대 퍼포먼스, 혹은 조용한 데스크톱
      곁지기까지, 언제든 당신의 일상에 맞추어 함께할 준비가 되어 있어요.
    pills:
      webgpu: 로컬 WebGPU 코어
      offline: 100% 오프라인 및 프라이버시 보호
      souls: 영혼과 아바타의 자유로운 결합
    actions:
      quickStart: 빠른 시작 (60초)
      guidedSetup: 단계별 안내 설정
      setupLater: 나중에 설정
    dialog:
      savedTitle: 설정이 저장되었습니다
      savedDescription: 'macOS 메뉴 막대 또는 시스템 트레이의 AIRI 아이콘을 클릭하여 언제든지 컴패니언 설정을 다시 열 수 있습니다:'
      trayItem: 컴패니언 설정 및 로그인 (V3)
      continue: 설정 계속하기
      closeToTray: 트레이로 최소화

  triage:
    label: 계정
    subtitle: 계정 로그인 및 아키텍처
    title: 계정 로그인 및 아키텍처
    description: 이 기기에서 완전한 오프라인 상태로 실행할지, 아니면 계정을 연결하여 원활한 클라우드 동기화와 백업을 사용할지 선택하세요.
    zeroTrustBadge: 제로 트러스트
    localOption:
      title: 로컬 컴패니언 (오프라인 보호)
      description: 100% 오프라인 및 비공개. 모든 캐릭터 카드, 기억, 상태가 로컬 브라우저/데스크톱 데이터베이스에만 저장되며 클라우드
        텔레메트리는 전송되지 않습니다.
      badge: 오프라인 우선
      action: 로컬에서 계속하기
    cloudOption:
      title: 계정 로그인 (Cloudflare)
      description: 계정을 연결하여 종단간 암호화를 통해 여러 기기 간에 컴패니언, 설정 및 메모리 볼트를 동기화하세요.
      badge: 다중 기기 동기화
      connect: Cloudflare로 로그인
      connected: Cloudflare에 연결됨
      accountPrefix: '계정 ID:'
    restore:
      foundCompanions: Cloudflare R2에서 {count}개의 컴패니언을 찾았습니다
      restoreAndLaunch: 복원하고 스테이지 실행 (~30초)
      restoreAndBuild: 복원 후 새 컴패니언 생성
      syncing: 원격 컴패니언 복원 중...
      bannerTitle: 원격 백업 발견
      bannerDesc: Cloudflare R2 보관소에서 {count}개의 컴패니언을 찾았습니다.
      restoring: 컴패니언 복원 중...
      restoreAll: 복원 후 스테이지 시작
    stepBadge: 아키텍처 선별 · 단계 {current} / {total}
    companionGreeting: AIRI에 오신 것을 환영합니다! 스테이지 설정 방식을 선택하세요. 100% 로컬 오프라인으로 실행하거나
      계정에 로그인하여 기기 간 동기화를 활성화할 수 있습니다.
    local:
      badge: 오프라인 우선
      title: 로컬 컴패니언 (완전 격리)
      description: 100% 오프라인 및 프라이빗. 모든 컴패니언 카드, 기억, 상태가 로컬 DB에 저장되며 외부 클라우드 통신이 없습니다.
      selectedCta: 선택됨 (로컬 모드)
      selectCta: 로컬 모드 선택
      features:
        f1: 기기 내 100% 오프라인 저장
        f2: 클라우드 원격 측정 및 외부 통신 제로
        f3: 로컬 데이터베이스 기반 즉각 시작
    cloud:
      badge: 10 GB 무료 + 클라우드 동기화
      title: 계정 로그인 (Cloudflare)
      description: 계정을 연결하여 10 GB 무료 저장 공간, 일일 엣지 AI 크레딧, 기기 전반의 24/7 컴패니언 상주를 활성화하세요.
      selectedCta: 선택됨 (클라우드 연동)
      selectCta: 클라우드 동기화 선택
      features:
        f1: 10 GB 무료 클라우드 저장 공간
        f2: 일일 무료 엣지 AI 크레딧
        f3: 24/7 Discord 클라우드 릴레이
        f4: 다중 기기 동기화 및 1클릭 복구
        f5: 비공개 CORS 프록시 및 제로 수탁 프라이버시
        storage:
          title: 10 GB 무료 클라우드 저장 공간
          desc: 하향 전송 수수료 없이 3D 모델, 커스텀 배경, 전체 메모리 볼트를 백업합니다.
          howItWorks: 사용자 소유의 Cloudflare R2 객체 스토리지를 기반으로 작동합니다.
          whyItMatters: 수십 개의 VRM/Live2D 모델과 수년 치의 대화 기록을 보관할 수 있는 넉넉한 무료 공간을 제공합니다. AWS
            S3와 달리 자산 다운로드는 대역폭 요금 $0으로 100% 무료입니다.
        ai:
          title: 일일 무료 엣지 AI 크레딧
          desc: DeepSeek, Qwen, Llama용 일일 10,000 무료 뉴런 제공(API 키 불필요).
          howItWorks: 8단계(의식) 진행 중 Cloudflare Workers AI에 직접 연결됩니다.
          whyItMatters: OpenAI 유료 구독, 신용카드 등록, 고사양 로컬 게이밍 GPU 없이도 엣지에서 최신 오픈 모델과 즉시 대화할 수
            있습니다.
        relay:
          title: 24/7 Discord 클라우드 릴레이
          desc: PC가 꺼져 있어도 Discord 서버에서 컴패니언이 항상 깨어 있도록 유지합니다.
          howItWorks: Discord 인터랙션 웹훅을 처리하는 서버리스 Cloudflare Worker(@proj-airi/stage-edge)로
            실행됩니다.
          whyItMatters: 컴패니언이 24시간 내내 Discord에서 대화하고 Edge KV에 기억을 저장하며, AIRI를 다시 열었을 때
            데스크톱으로 자동 동기화합니다.
        sync:
          title: 다중 기기 동기화 및 1클릭 복구
          desc: 데스크톱, 웹, 모바일을 매끄럽게 동기화하고 한 번의 클릭으로 컴패니언을 복구하세요.
          howItWorks: Edge Key Vault(airi-edge-vault)가 활성 컴패니언 상태를 안전하게 추적합니다.
          whyItMatters: AIRI를 재설치하거나 새 노트북/휴대폰으로 변경해도 키를 수동으로 입력할 필요 없이 컴패니언, 설정, 기억이 자동으로
            복원됩니다.
        proxy:
          title: 비공개 CORS 프록시 및 제로 수탁 프라이버시
          desc: 100% 제로 수탁 데이터 프라이버시로 까다로운 로컬 및 원격 AI API에 접근합니다.
          howItWorks: 웹 및 모바일 스테이지를 위해 브라우저 CORS 헤더를 우회하는 개인용 엣지 리버스 프록시를 배포합니다.
          whyItMatters: 모든 것은 개인 Cloudflare 계정 내에서 실행됩니다. AIRI는 중간 서버를 두지 않으며 사용자의 대화를 결코
            읽거나 저장하거나 수집하지 않습니다.
    auth:
      connected: Cloudflare 연결 완료
      disconnect: 연결 해제
      autoTab: 1클릭 브라우저 인증
      tokenTab: API 토큰
      verifying: 확인 중...
      oauthButton: Cloudflare로 로그인
      tokenPlaceholder: Cloudflare API 토큰 붙여넣기...
      verifyToken: 토큰 연결

  appearance:
    label: 외관
    subtitle: 언어, 테마 및 강조 색상
    title: 언어 및 외관 설정
    description: 인터페이스 언어, 비주얼 테마, 시그니처 강조 색상을 맞춤 설정하세요.
    languageSection:
      title: 표시 언어
      description: AIRI의 기본 인터페이스 언어를 선택하세요. 언제든지 변경할 수 있습니다.
    themeSection:
      title: 테마 모드
      description: 선호하는 외관 색상 모드를 선택하세요.
      dark: 다크 모드
      light: 라이트 모드
      system: 시스템 동기화
      darkDesc: 깊은 흑요석 톤
      lightDesc: 밝은 자연광 스튜디오
    colorSection:
      title: 시그니처 강조 팔레트
      description: 버튼, 하이라이트, 아바타 광채 효과를 장식할 고유한 악센트 색상을 선택하세요.
      defaultColor: 기본 시안
      custom: 사용자 정의 HEX
      groups:
        warm: 웜 & 파이어
        flora: 어스 & 플로라
        ocean: 오션 & 스카이
        royal: 로열 & 블룸
      activeColor: '적용 중: {color}'
    perDeviceToggle: 이 외관 설정을 현재 기기에만 유지 (클라우드 동기화 덮어쓰기 방지)

  experience:
    label: 경험
    subtitle: 인터랙션 아키타입
    title: 인터랙션 아키타입
    description: 엄선된 컴패니언 경험 프리셋을 선택하세요. 선호도에 따라 불필요한 모듈과 단계가 동적으로 제외됩니다.
    archetypes:
      quietObserver:
        title: 조용한 관찰자 (Quiet Observer)
        tag: 가장 빠름 · 미니멀리스트
        description: 초경량 텍스트 컴패니언. 아바타가 표정으로 반응하고 내면의 생각과 장기 기억을 지니되 오디오나 비전 부하는 전혀 없습니다.
      casualCompanion:
        title: 친근한 동반자 (Casual Companion)
        tag: 인기 선택
        description: 대표적인 음성 및 비주얼 컴패니언. 자연스러운 음성 대화 (STT/TTS), 사진 인식 (VLM), 편안한 대화 호흡과
          장기 기억.
      creativeMuse:
        title: 창작의 뮤즈 (Creative Muse)
        tag: 비주얼 포커스
        description: 시각적 영감의 스튜디오. 음성 대화, 자율적 AI 이미지 생성 (Pollinations/ComfyUI), 사진 이해와
          풍부한 표정 변화.
      executiveCopilot:
        title: 비즈니스 코파일럿 (Executive Copilot)
        tag: 생산성 중심
        description: 업무 지원에 특화. 음성 대화, 데스크톱 화면 감지, 윈도우 기록 추적, 로컬 파일 시스템 MCP 도구 및 실시간 웹 검색.
      ambientRoommate:
        title: 룸메이트 (Ambient Roommate)
        tag: 자율적 존재감
        description: 일상을 함께하는 존재. 음성 대화, 환경 하트비트를 통한 자발적 대화 시도, 수면 스케줄 및 화면 관찰.
      swissArmy:
        title: 만능 컴패니언 (Swiss Army)
        tag: 전 기능 탑재 · 올인원
        description: '모든 기능을 갖춘 플래그십 경험: 양방향 음성, 비전 분석, 화면 관찰, 자발적 대화, 예술 창작, 외부 도구 및
          4사분면 기억.'
      quiet:
        title: 조용한 관찰자
        badge: ⚡ 가장 빠름 · 미니멀
        subtitle: 텍스트, 도구 & 기억
        description: 오디오 오버헤드 제로, 아바타 감정 표현, 생각 호흡 및 장기 기억을 갖춘 초경량 텍스트 컴패니언.
      casual:
        title: 캐주얼 컴패니언
        badge: ✨ 인기 있는 선택
        subtitle: 음성 대화 & 비전
        description: 실시간 음성 인식(STT), 감성 음성 합성(TTS), 사진 인식, 자연스러운 템포 및 기억.
      muse:
        title: 크리에이티브 뮤즈
        badge: 🎨 비주얼 포커스
        subtitle: 음성, 비전 & 아트 생성
        description: 음성 대화, 이미지 생성(Pollinations/ComfyUI), 채팅 사진 인식 및 풍부한 아바타 모핑.
      copilot:
        title: 이그제큐티브 코파일럿
        badge: 💼 생산성
        subtitle: 음성 + 작업 도구
        description: 음성 대화, 데스크톱 화면 감지, 로컬 파일시스템 MCP 도구 및 실시간 웹 검색.
      roommate:
        title: 앰비언트 룸메이트
        badge: 🌙 일상적인 존재감
        subtitle: 생활 루틴 & 교감
        description: 음성 대화, 환경 심장박동, 수면 스케줄, 방해 금지 시간 및 화면 인지.
      swiss-army:
        title: 만능 맥가이버 컴패니언
        badge: 🔥 풀옵션 · 올인원
        subtitle: 음성, 비전 & 행동
        description: 모든 기능을 갖춘 플래그십 컴패니언. 청각, 뉴럴 보이스, 생각 템포, 2-패스 ACT 감정, 화면 감지, 아트 생성 및
          인지 기억 계층.
    advanced:
      toggle: '고급: 개별 모듈 직접 설정'
      description: 특정 감각 및 인지 기능 모듈을 켜거나 끌 수 있습니다.
      modules:
        hearing: 청각 (마이크 음성 인식 전사)
        speech: 음성 (신경망 음성 합성)
        thinking: 사고 (호흡 조절 및 내면 독백)
        emotions: 감정 (2-Pass ACT 표정 브리지)
        vision: 시각 (채팅 사진 이해 및 분석)
        screen: 화면 (데스크톱 화면 관찰 및 OCR)
        proactivity: 자율성 (일상 일정 및 환경 하트비트)
        artistry: 예술 창작 (이미지 생성 및 자율 디렉터)
        memory: 기억 체계 (4사분면 인지 메모리)
        tools: 도구 (웹 검색 및 데스크톱 MCP)
    hideModules: 모듈 숨기기
    customizeModules: '고급: 개별 모듈 사용자 정의'

  profile:
    label: 프로필
    subtitle: 사용자 정보
    title: 정체성 및 컴패니언 관계
    description: 컴패니언이 당신을 어떻게 불러야 하는지, 어떤 관계 역동을 원하는지 알려주세요.
    userName:
      label: 컴패니언이 당신을 뭐라고 부르면 좋을까요?
      placeholder: '예: 마스터, 알렉스, 선배, 프로듀서'
    pronouns:
      label: 호칭 대명사
      placeholder: '예: 그, 그녀, 당신'
      he: 남성
      she: 여성
      they: 논바이너리
    relationship:
