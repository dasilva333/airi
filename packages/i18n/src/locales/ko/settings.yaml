        fields:
          enableG1Prefill:
            description: 'G1 추론 모델을 학습된 모드로 유지하기 위해 어시스턴트 턴에 <think></think>를 미리 채우고 출력 시 선행
              닫는 태그를 제거합니다. 비 G1(예: RWKV-6/5) 모델을 사용하는 경우 비활성화하세요.'
