          vocab:
            description: 번들된 RWKV World 토크나이저 어휘를 재정의합니다. 다른 언어에 최적화된 미세 조정 또는 사용자 지정 토큰 매핑을
              사용하는 경우 여기에 어휘 JSON URL을 제공하면 적절한 텍스트 인코딩 및 생성 동작이 보장됩니다.
