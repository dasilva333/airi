      continue: Poursuivre la configuration
      closeToTray: Réduire dans la barre d'état

  triage:
    label: Compte
    subtitle: Connexion et architecture
    title: Connexion et architecture du compte
    description: Choisissez d'exécuter l'application de façon totalement isolée et
      hors-ligne sur cet appareil, ou de connecter un compte pour synchroniser
      et sauvegarder vos données dans le cloud.
    zeroTrustBadge: Zéro-Confiance
