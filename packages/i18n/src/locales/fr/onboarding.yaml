    themeSection:
      title: Mode de thème
      description: Choisissez votre mode d'apparence préféré.
      dark: Sombre
      light: Clair
      system: Synchronisé avec le système
      darkDesc: Tons obsidienne profonds
      lightDesc: Studio lumineux en plein jour
    colorSection:
      title: Palette d'accentuation
      description: Choisissez une nuance personnalisée pour teinter les boutons,
        surbrillances et halos d'avatar.
      defaultColor: Cyan par défaut
      custom: Hexadécimal personnalisé
      groups:
        warm: Chaleur & Flammes
        flora: Terre & Végétal
        ocean: Océan & Ciel
        royal: Royal & Floraison
      activeColor: 'Actif : {color}'
    perDeviceToggle: Conserver cette apparence uniquement sur cet appareil (exclure
      de la synchronisation cloud)

  experience:
    label: Expérience
    subtitle: Archétype d'interaction
    title: Archétypes d'interaction
    description: Sélectionnez un modèle d'expérience préconfiguré. Les modules
      inutiles seront automatiquement masqués.
    archetypes:
      quietObserver:
        title: L'Observateur Silencieux
        tag: Le plus rapide · Minimaliste
        description: Compagnon textuel ultra-léger. L'avatar réagit avec émotion,
          dispose de pensées intérieures et de mémoire à long terme, sans aucune
          charge audio ou visuelle.
      casualCompanion:
        title: Le Compagnon Quotidien
        tag: Choix populaire
        description: Le compagnon vocal et visuel par excellence. Voix naturelle
          (STT/TTS), compréhension des images du chat (VLM), pauses de
          conversation réalistes et mémoire.
      creativeMuse:
        title: La Muse Créative
        tag: Accent sur l'art visuel
        description: Studio d'inspiration artistique. Voix parlée, génération d'images
          autonome (Pollinations/ComfyUI), compréhension de photos et riches
          expressions faciales.
      executiveCopilot:
        title: Le Copilote Exécutif
        tag: Productivité ciblée
        description: Taillé pour l'efficacité. Dialogue vocal, perception des fenêtres
          du bureau, historique d'applications, outils MCP locaux et recherche
          web en temps réel.
      ambientRoommate:
        title: Le Colocataire Ambiant
        tag: Présence proactive
        description: Présence et routine quotidienne partagée. Voix parlée, battements
          de cœur spontanés, horaires de sommeil respectueux et observation de
          l'écran.
      swissArmy:
        title: Le Couteau Suisse (Tout-en-un)
        tag: Toutes les étapes · Complet
        description: "L'expérience fleuron intégrale : dialogue vocal bidirectionnel,
          vision, observation d'écran, proactivité, création artistique, outils
          MCP et mémoire à 4 quadrants."
      quiet:
        title: L'Observateur Silencieux
        badge: ⚡ Le Plus Rapide · Minimaliste
        subtitle: Texte, Outils & Mémoire
        description: Zéro surcharge audio, émotions d'avatar, pauses de réflexion et
          mémoire à long terme.
      casual:
        title: Le Compagnon Décontracté
        badge: ✨ Choix Populaire
        subtitle: Dialogue Vocal & Vision
        description: Transcription vocale en direct (STT), voix émotionnelle (TTS),
          vision photo, rythme naturel et mémoire.
      muse:
        title: La Muse Créative
        badge: 🎨 Accent Visuel
        subtitle: Voix, Vision & Créativité
        description: Dialogue vocal, génération d’images (Pollinations/ComfyUI), vision
          par chat et métamorphoses expressives.
      copilot:
        title: Le Copilote Exécutif
        badge: 💼 Productivité
        subtitle: Voix + Outils d'Action
        description: Dialogue vocal, observation de l'écran, outils système MCP locaux
          et recherche web en temps réel.
      roommate:
        title: Le Colocataire Ambiant
        badge: 🌙 Présence Proactive
        subtitle: Routine & Présence Vivante
        description: Voix parlée, battements de cœur ambiants, rythme de sommeil, heures
          calmes et perception de l'écran.
      swiss-army:
        title: Le Couteau Suisse
        badge: 🔥 Toutes Options · Tout-en-un
        subtitle: Voix, Vision & Action
        description: Le compagnon tout-en-un par excellence. Ouïe, voix neuronale,
          pauses de réflexion, émotions ACT en 2 passes, vision d'écran, art et
          mémoire cognitive.
    advanced:
      toggle: 'Avancé : Personnaliser les modules individuels'
      description: Activez ou désactivez manuellement les différents modules
        sensoriels et cognitifs.
      modules:
        hearing: Ouïe (Transcription vocale par microphone)
        speech: Parole (Synthèse vocale neuronale)
        thinking: Réflexion (Rythme etapartés intérieurs)
        emotions: Émotions (Pont d'expressions ACT en 2 passes)
        vision: Vision (Analyse des images du chat)
        screen: Écran (Observation du bureau et OCR)
        proactivity: Proactivité (Routine quotidienne et battements de cœur)
        artistry: Art visuel (Génération d'images et directeur autonome)
        memory: Mémoire (Hiérarchie cognitive en 4 quadrants)
        tools: Outils (Recherche web et MCP de bureau)
    hideModules: Masquer les modules
    customizeModules: 'Avancé : Personnaliser les modules'

