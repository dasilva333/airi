    companionQuote: "Bonjour ! Je suis votre compagnon numérique autonome. Que vous
      souhaitiez une conversation vocale, des performances scéniques expressives
      ou une présence discrète sur votre bureau, je suis prête à m'adapter à
      votre univers."
    pills:
