              G1
          model:
            description: Une URL .safetensors avec des noms de tenseurs natifs RWKV — soit
              converti pour web-rwkv, soit HuggingFace brut (la disposition est
              détectée automatiquement). bf16/f32 sont convertis en f16 au
              chargement. PyTorch .pth n'est pas pris en charge ;
              convertissez-le d'abord en safetensors (convert_safetensors.py).
            label: URL du modèle
