            description: Remplacer le vocabulaire du tokenizer RWKV World intégré. Si vous
              utilisez un modèle affiné pour une autre langue ou un mappage de
              jetons personnalisé, fournir son URL JSON de vocabulaire garantit
              un encodage et une génération corrects.
