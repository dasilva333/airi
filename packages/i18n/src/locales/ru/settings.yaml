      web-rwkv:
        alert:
          content: RWKV полностью работает в вашем браузере через WebGPU — без ключа API и
            без сервера. Модель загружается при первом использовании и
            кэшируется; веса bf16/f32 автоматически конвертируются в f16 при
            загрузке. Требуется браузер с поддержкой WebGPU или Electron
            (CPU/WASM фолбэк отсутствует).
          title: LLM в браузере только через WebGPU
        defaultsSection:
          annotation: 'Чтобы настроить эти параметры для персонажа, перейдите на вкладку
            «Генерация» персонажа: • Измените температуру, Top P и максимальное
            количество токенов с помощью полей ввода. • Измените штрафы
            (присутствие/количество/затухание), введя их в расширенное поле JSON
            (напр. "presence_penalty": 0.5).'
          description: Это резервные параметры по умолчанию, используемые web-rwkv.
          field:
            count_penalty: 'Штраф за частоту Count Penalty (По умолчанию: 0.4)'
            max_tokens: 'Макс. токенов Max Tokens (По умолчанию: 512)'
            penalty_decay: 'Затухание штрафа Penalty Decay (По умолчанию: 0.996)'
            presence_penalty: 'Штраф за присутствие Presence Penalty (По умолчанию: 0.4)'
            temperature: 'Температура Temperature (По умолчанию: 1.0)'
            top_p: 'Top P (По умолчанию: 0.5)'
          title: Параметры генерации по умолчанию (только для чтения)
        description: Локальная модель RWKV-7 в браузере через WebGPU (без ключа API)
        fields:
          enableG1Prefill:
            description: Предварительно заполняет ответы ассистента тегами <think></think>
              для поддержания режима рассуждения моделей G1 и удаляет начальный
              закрывающий тег в выводе. Отключите для моделей, отличных от G1
              (напр. RWKV-6/5).
            label: Включить префилл рассуждений G1 и удаление тегов
          model:
            description: URL .safetensors с нативными именами тензоров RWKV —
              конвертированный для web-rwkv или оригинальный HuggingFace
              (структура определяется автоматически). bf16/f32 приводятся к f16
              при загрузке. PyTorch .pth не поддерживается, сначала
              конвертируйте в safetensors (convert_safetensors.py).
            label: URL модели
          vocab:
            description: Переопределить встроенный словарь токенизатора RWKV World. Если вы
              используете дообученную модель для другого языка, указание URL
              словаря гарантирует правильную кодировку.
            label: URL словаря (необязательно)
            placeholder: (встроенный rwkv_vocab_v20230424.json)
        title: RWKV (локально, WebGPU)
