      savedDescription: 'Вы всегда можете вернуться к настройке компаньона через
        значок AIRI в строке меню macOS или системном трее:'
      trayItem: Настройка и вход компаньона (V3)
      continue: Продолжить настройку
      closeToTray: Свернуть в трей

  triage:
    label: Аккаунт
    subtitle: Вход в систему и архитектура
    title: Вход в систему и выбор архитектуры
    description: Выберите, запускать ли компаньона полностью изолированно и оффлайн
      на этом устройстве, либо подключить аккаунт для облачной синхронизации и
      резервного копирования.
    zeroTrustBadge: Zero-Trust
    localOption:
      title: Локальный компаньон (Оффлайн)
      description: 100% оффлайн и приватность. Все карточки персонажей, память и
        состояния хранятся только в локальной базе данных без внешней
        телеметрии.
      badge: Локальный приоритет
      action: Продолжить локально
    cloudOption:
      title: Вход в аккаунт (Cloudflare)
      description: Подключите аккаунт для синхронизации компаньонов, настроек и
        хранилищ памяти между устройствами со сквозным шифрованием.
      badge: Мультиплатформенная синхронизация
      connect: Войти через Cloudflare
      connected: Подключено к Cloudflare
      accountPrefix: 'ID аккаунта:'
    restore:
      foundCompanions: 'Найдено компаньонов в Cloudflare R2: {count}'
      restoreAndLaunch: Восстановить и запустить сцену (~30 сек)
      restoreAndBuild: Восстановить и создать нового
      syncing: Восстановление удаленных компаньонов...
      bannerTitle: Найдены резервные копии
      bannerDesc: Найдено {count} компаньон(ов) в вашем хранилище Cloudflare R2.
      restoring: Восстановление компаньонов...
      restoreAll: Восстановить и запустить сцену
    stepBadge: Выбор архитектуры · Шаг {current} из {total}
    companionGreeting: 'Добро пожаловать в AIRI! Выберите способ настройки сцены:
      полностью локально и офлайн или с подключением аккаунта для синхронизации
      между устройствами.'
    local:
      badge: Сначала офлайн
      title: Локальный компаньон (Изолированный)
      description: 100% офлайн и конфиденциально. Все карты, память и состояние
        хранятся локально без облачной телеметрии.
      selectedCta: Выбрано (Локально)
      selectCta: Выбрать локальный режим
      features:
        f1: 100% офлайн-хранилище на устройстве
        f2: Ноль телеметрии и внешних сетевых запросов
        f3: Мгновенный запуск с локальной базой данных
    cloud:
      badge: 10 ГБ Бесплатно + Облачная Синхронизация
      title: Вход в аккаунт (Cloudflare)
      description: Подключите учетную запись, чтобы разблокировать 10 ГБ бесплатного
        хранилища, ежедневные кредиты edge-ИИ и круглосуточное присутствие
        компаньона на всех устройствах.
      selectedCta: Выбрано (Облако)
      selectCta: Выбрать синхронизацию
      features:
        f1: 10 ГБ бесплатного облачного хранилища
        f2: Ежедневные бесплатные кредиты Edge-ИИ
        f3: Круглосуточный облачный ретранслятор Discord
        f4: Синхронизация между устройствами и восстановление в 1 клик
        f5: Приватный CORS-прокси и нулевое хранение данных
        storage:
          title: 10 ГБ бесплатного облачного хранилища
          desc: Резервное копирование 3D-моделей, фонов и полных хранилищ памяти без
            комиссии за исходящий трафик.
          howItWorks: Работает на базе пользовательского объектного хранилища Cloudflare
            R2.
          whyItMatters: Щедрый бесплатный тариф вмещает десятки моделей VRM/Live2D и
            многолетнюю историю диалогов. В отличие от AWS S3, загрузка ваших
            ресурсов на 100% бесплатна с комиссией $0 за трафик.
        ai:
          title: Ежедневные бесплатные кредиты Edge-ИИ
          desc: 10 000 бесплатных Neurons в день для DeepSeek, Qwen и Llama (без
            необходимости в API-ключе).
          howItWorks: Прямое подключение к Cloudflare Workers AI на Шаге 8 (Сознание).
          whyItMatters: Мгновенно общайтесь с передовыми открытыми моделями на edge без
            платной подписки OpenAI, банковской карты или мощной дискретной
            видеокарты.
        relay:
          title: Круглосуточный облачный ретранслятор Discord
          desc: Компаньон остается активен на вашем сервере Discord, даже когда ваш ПК
            выключен.
          howItWorks: Работает как бессерверный Cloudflare Worker (@proj-airi/stage-edge),
            обрабатывающий вебхуки взаимодействий Discord.
          whyItMatters: Компаньон общается в Discord 24/7, сохраняет контекст в Edge KV и
            синхронизирует диалоги с ПК при повторном открытии AIRI.
        sync:
          title: Синхронизация между устройствами и восстановление в 1 клик
          desc: Бесшовная синхронизация между ПК, веб-версией и мобильными устройствами;
            восстановление компаньонов в один клик.
          howItWorks: Хранилище ключей Edge Key Vault (airi-edge-vault) надежно
            отслеживает текущее состояние компаньона.
          whyItMatters: Переустановка AIRI или переезд на новый ноутбук/смартфон
            автоматически восстанавливает компаньона, настройки и воспоминания
            без ручного ввода ключей.
        proxy:
          title: Приватный CORS-прокси и нулевое хранение данных
          desc: Доступ к сложным локальным и удаленным AI API со 100% гарантией нулевого
            хранения данных.
          howItWorks: Развертывание персонального обратного прокси-сервера edge для обхода
            ограничений CORS браузера на веб- и мобильных платформах.
          whyItMatters: Все работает исключительно в вашей учетной записи Cloudflare. AIRI
            не использует промежуточных серверов и никогда не читает, не хранит
            и не собирает ваши переписки.
    auth:
      connected: Подключено к Cloudflare
      disconnect: Отключить
      autoTab: Браузер в 1 клик
      tokenTab: API токен
      verifying: Проверка...
      oauthButton: Войти через Cloudflare
      tokenPlaceholder: Вставьте ваш API токен Cloudflare...
      verifyToken: Подключить токен

