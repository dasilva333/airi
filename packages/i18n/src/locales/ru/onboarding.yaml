        proactivity: Проактивность (Режим дня и фоновые импульсы)
        artistry: Творчество (Генерация изображений и режиссер)
        memory: Память (Иерархия 4 квадрантов памяти)
        tools: Инструменты (Поиск в сети и системный MCP)
