  experience:
    label: Опыт
    subtitle: Архетип взаимодействия
    title: Архетипы взаимодействия
    description: Выберите готовый стиль общения. Неиспользуемые модули и шаги
      настройки будут автоматически скрыты.
    archetypes:
      quietObserver:
        title: Тихий наблюдатель
        tag: Быстрый · Минималистичный
        description: Сверхлегкий текстовый компаньон. Аватар чутко реагирует эмоциями,
          обладает мышлением и долговременной памятью без нагрузки на аудио и
          видео.
      casualCompanion:
        title: Повседневный друг
        tag: Популярный выбор
        description: Классический компаньон с голосом и визуалом. Естественная речь
          (STT/TTS), распознавание фото в чате (VLM), живой темп диалога и
          память.
      creativeMuse:
        title: Творческая муза
        tag: Фокус на визуале
        description: Студия визуального вдохновения. Голосовое общение, автономная
          генерация артов (Pollinations/ComfyUI), понимание изображений и
          выразительная мимика.
      executiveCopilot:
        title: Деловой помощник
        tag: Для продуктивности
        description: Создан для эффективной работы. Голосовой диалог, восприятие окон на
          рабочем столе, локальные инструменты MCP и поиск в сети в реальном
          времени.
      ambientRoommate:
        title: Сосед по комнате
        tag: Проактивное присутствие
        description: Живой ритм и постоянная поддержка. Голос, спонтанные реплики по
          фоновым импульсам, режим сна и наблюдение за экраном.
      swissArmy:
        title: Универсальный комбайн
        tag: Все возможности · Полный набор
        description: 'Флагманский опыт: двусторонний голос, зрение, наблюдение за
          экраном, проактивность, арт-генерация, внешние инструменты и 4
          квадранта памяти.'
      quiet:
        title: Тихий наблюдатель
        badge: ⚡ Самый быстрый · Минимализм
        subtitle: Текст, инструменты и память
        description: Нулевая нагрузка на аудио, эмоции аватара, паузы размышлений и
          долговременная память.
      casual:
        title: Повседневный компаньон
        badge: ✨ Популярный выбор
        subtitle: Голосовой диалог и зрение
        description: Распознавание речи (STT), эмоциональный голос (TTS), зрение фото,
          естественный темп и память.
      muse:
        title: Творческая муза
        badge: 🎨 Визуальный фокус
        subtitle: Голос, зрение и искусство
        description: Голосовой диалог, генерация изображений (Pollinations/ComfyUI),
          распознавание фото и выразительные морфы.
      copilot:
        title: Исполнительный второй пилот
        badge: 💼 Продуктивность
        subtitle: Голос + инструменты действий
        description: Голосовой диалог, наблюдение за экраном, локальные инструменты MCP
          и поиск в реальном времени.
      roommate:
        title: Сосед по комнате
        badge: 🌙 Проактивное присутствие
        subtitle: Живая рутина и присутствие
        description: Голос, фоновые пульсы активности, расписание сна, тихие часы и
          осведомленность об экране.
      swiss-army:
        title: Швейцарский нож
        badge: 🔥 Все опции · Всё в одном
        subtitle: Голос, зрение и действия
        description: 'Флагманский компаньон со всеми возможностями: слух, нейросетевой
          голос, паузы размышлений, 2-проходные эмоции ACT, экран, арт и
          когнитивная память.'
    advanced:
      toggle: 'Дополнительно: настройка отдельных модулей'
      description: Включайте или отключайте определенные сенсорные и мыслительные
