      deepCot:
        title: Deep CoT
        description: Extended chain-of-thought contemplation with rich dynamic spoken
          asides while thinking.
    subconsciousAsides: Subconscious Spoken Asides (Needle 2 WASM)
    asidesDescription: Permit companion to vocalize inner train-of-thought
