      verifyToken: Connect Token

  appearance:
    label: Tampilan
    subtitle: Bahasa, Tema & Aksen
    title: Bahasa & Tampilan
    description: Atur bahasa antarmuka, tema visual, dan warna aksen khas Anda.
    languageSection:
      title: Bahasa Tampilan
      description: Pilih bahasa utama Anda untuk AIRI. Anda dapat mengubahnya kapan saja.
    themeSection:
      title: Mode Tema
      description: Pilih mode tampilan yang Anda sukai.
      dark: Gelap
      light: Terang
      system: Sinkronisasi Sistem
      darkDesc: Nuansa obsidian yang pekat
      lightDesc: Nuansa studio terang benderang
    colorSection:
      title: Palet Aksen Khas
      description: Pilih nada aksen untuk mempersonalisasi tombol, sorotan, dan efek cahaya avatar.
      defaultColor: Sian Default
      custom: Hex Kustom
      groups:
        warm: Hangat & Berapi
        flora: Bumi & Tumbuhan
        ocean: Samudra & Langit
        royal: Megah & Mekar
      activeColor: 'Aktif: {color}'
    perDeviceToggle: Pertahankan tampilan lokal di perangkat ini (kecualikan dari sinkronisasi awan)

  experience:
    label: Experience
    subtitle: Interaction Archetype
    title: Interaction Archetypes
    description: Select a curated companion experience archetype. This dynamically
      customizes active modules and prunes unneeded steps.
    archetypes:
      quietObserver:
        title: The Quiet Observer
        tag: Fastest · Minimalist
        description: Ultra-fast, lightweight text companion. Avatar emotes on stage, has
          inner thoughts and deep memory, with zero audio, vision, or system
          overhead.
      casualCompanion:
        title: The Casual Companion
        tag: Popular Choice
        description: The quintessential voice and visual companion. Natural speech
          (STT/TTS), chat photo perception (VLM), natural pacing, and long-term
          memory.
      creativeMuse:
        title: The Creative Muse
        tag: Visual Focus
        description: Visual inspiration studio. Spoken voice, visual generation
          (Pollinations/ComfyUI), chat photo understanding, and expressive
          avatar morphs.
      executiveCopilot:
        title: The Executive Copilot
        tag: Productivity
        description: Focused productivity. Voice dialogue, desktop display perception,
          active window history, local filesystem MCP tools, and live web
          search.
      ambientRoommate:
        title: The Ambient Roommate
        tag: Proactive Presence
        description: Living routine & presence. Spoken voice, ambient heartbeats, sleep
          schedule, quiet hours, and desktop screen awareness.
      swissArmy:
        title: The Swiss Army Companion
        tag: Most Steps · All-In-One
        description: 'The flagship do-it-all: Voice STT/TTS, vision, screen watching,
          proactivity, artistry, tools & memory hierarchy.'
      quiet:
        title: The Quiet Observer
        badge: ⚡ Fastest · Minimalist
        subtitle: Text, Expressions & Memory
        description: Zero audio overhead, avatar emotions, thinking pacing, and long-term
          memory.
      casual:
        title: The Casual Companion
        badge: ✨ Popular Choice
        subtitle: Voice Dialogue & Vision
        description: Live speech transcription (STT), emotional voice (TTS), photo vision,
          natural pacing, and memory.
      muse:
        title: The Creative Muse
        badge: 🎨 Visual Focus
        subtitle: Voice, Vision & Artistry
        description: Spoken dialogue, image generation (Pollinations/ComfyUI), chat vision,
          and expressive morphs.
      copilot:
        title: The Executive Copilot
        badge: 💼 Productivity
        subtitle: Voice + Action Tools
        description: Voice dialogue, desktop screen watching, local filesystem action
          tools, and live web search.
      roommate:
        title: The Ambient Roommate
        badge: 🌙 Proactive Presence
        subtitle: Living Routine & Presence
        description: Spoken voice, ambient heartbeats, sleep schedule, quiet hours, and
          screen awareness.
      swiss-army:
        title: The Swiss Army Companion
        badge: 🔥 Most Steps · All-In-One
        subtitle: Full Autonomous Multimodal
        description: The quintessential all-in-one companion. Hearing, neural voice,
          thinking pacing, 2-pass ACT emotions, screen watching, artistry, and
          cognitive memory.
    advanced:
      toggle: 'Advanced: Customize Individual Modules'
      description: Toggle individual sensory and cognitive capabilities on or off.
      modules:
        hearing: Hearing (Microphone Transcription)
        speech: Speech (Neural Voice Synthesis)
        thinking: Thinking (Pacing & Subconscious Asides)
        emotions: Emotions (2-Pass ACT Expression Bridge)
        vision: Vision (Chat Photo Understanding)
        screen: Screen (Desktop Perception & OCR)
        proactivity: Proactivity (Daily Schedule & Heartbeats)
        artistry: Artistry (Image Generation & Director)
        memory: Memory (Cognitive Memory Hierarchy)
        tools: Tools (Web Search & Desktop MCP)
    hideModules: Hide Modules
    customizeModules: 'Advanced: Customize Modules'

  profile:
