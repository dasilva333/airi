      trayItem: Penyiapan & Masuk Pendamping (V3)
      continue: Lanjutkan Penyiapan
      closeToTray: Tutup ke Baki Sistem

  triage:
    label: Akun
    subtitle: Masuk Akun & Arsitektur
    title: Masuk Akun & Arsitektur
    description: Pilih apakah ingin berjalan sepenuhnya terisolasi di mesin ini, atau hubungkan akun untuk sinkronisasi awan dan cadangan yang lancar.
    zeroTrustBadge: Zero-Trust
    localOption:
      title: Pendamping Lokal (Air-Gapped)
      description: 100% offline dan pribadi. Semua kartu pendamping, memori, dan status disimpan secara lokal di basis data peramban/desktop Anda tanpa telemetri awan.
      badge: Offline Pertama
      action: Lanjutkan Secara Lokal
    cloudOption:
      title: Masuk Akun (Cloudflare)
      description: Hubungkan akun Anda untuk menyinkronkan pendamping, pengaturan, dan brankas memori lintas perangkat dengan enkripsi end-to-end.
      badge: Sinkronisasi Multi-Perangkat
      connect: Masuk dengan Cloudflare
      connected: Connected to Cloudflare
      accountPrefix: 'Account ID:'
    restore:
      foundCompanions: Found {count} companion(s) in Cloudflare R2
      restoreAndLaunch: Restore & Launch Stage (~30s)
      restoreAndBuild: Restore & Build Another Companion
      syncing: Restoring remote companions...
      bannerTitle: Remote Backups Found
      bannerDesc: Found {count} companion(s) in your Cloudflare R2 vault.
      restoring: Restoring companions...
      restoreAll: Restore & Launch Stage
    stepBadge: Architecture Triage · Step {current} of {total}
    companionGreeting: Welcome to AIRI! Choose how you'd like to set up your stage. You can run
      100% locally and offline, or sign in to sync across devices.
    local:
      badge: Offline First
      title: Local Companion (Air-Gapped)
      description: 100% offline and private. All companion cards, memories, and state are
        stored locally in your browser/desktop database with zero cloud
        telemetry.
      selectedCta: Selected (Air-Gapped)
      selectCta: Choose Local Mode
      features:
        f1: 100% offline on-device storage
        f2: Zero cloud telemetry or external network calls
        f3: Instant startup with local database
    cloud:
      badge: Multi-Device Sync
