      webgpu: Inti WebGPU Lokal
      offline: 100% Offline & Pribadi
      souls: Padukan Jiwa + Raga
    actions:
      quickStart: Mulai Cepat (60 dtk)
      guidedSetup: Penyiapan Terpandu
      setupLater: Siapkan Nanti
    dialog:
      savedTitle: Penyiapan Disimpan untuk Nanti
