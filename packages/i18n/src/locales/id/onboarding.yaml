steps:
  welcome:
    label: Selamat Datang
    subtitle: Studio Pendamping Pribadi
    heroTitle: Selamat Datang di AIRI
    heroSubtitle: Panggung pendamping Anda — disiapkan dalam hitungan menit, 100% di komputer Anda.
    companionQuote: Halo! Saya pendamping digital otonom Anda. Baik Anda menginginkan percakapan suara, pertunjukan kreatif, atau kehadiran desktop yang tenang, saya siap beradaptasi dengan dunia Anda.
