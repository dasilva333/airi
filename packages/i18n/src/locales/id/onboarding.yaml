    pitch: Voice Pitch
    speed: Speaking Rate

  thinking:
    label: Thinking
    subtitle: Pacing & Subconscious Asides
    title: Thinking & Conversational Pacing
    description: Configure thinking pauses, dynamic fillers, and subconscious spoken
      asides during reasoning.
    presets:
      snappy:
        title: Snappy
        description: Ultra-fast 200ms responses with instant direct replies. Minimum
          thinking latency.
      balanced:
        title: Balanced
        description: Natural human conversational rhythm with adaptive conversational
