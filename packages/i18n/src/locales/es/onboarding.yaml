        description: Rutina viva y presencia constante. Voz hablada, comentarios
          espontáneos por latidos ambientales, horario de sueño y observación de
          pantalla.
      swissArmy:
        title: Navaja Suiza (Todo en Uno)
        tag: Todos los pasos · Completo
        description: 'La experiencia insignia integral: audio bidireccional, análisis
          visual, observación de pantalla, proactividad, arte, herramientas
