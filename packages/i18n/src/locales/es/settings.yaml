    onboarding:
      artistry:
        description: El estándar para arte con IA local es <b>ComfyUI</b>. Si prefieres
          la nube, <b>Replicate</b> ofrece una amplia variedad de modelos con
          precios de pago por uso.
        title: ¿Generar arte?
      chat:
        description: Para un inicio rápido, recomendamos <b>Google Gemini</b> (Nube
          gratuita) u <b>OpenRouter</b> (Nube unificada). Si prefieres
          privacidad y tienes GPU, usa <b>Ollama</b> o <b>LM Studio</b> para una
          experiencia local.
        title: ¿Nuevo en Chat?
      speech:
        description: Prueba <b>Deepgram</b> o <b>Azure Speech</b> para voces de alta
          calidad en la nube con niveles gratuitos. Para una solución
          completamente local y gratuita, usa <b>Web Speech API</b> o <b>Kokoro
          TTS</b>.
        title: ¿Necesitas una voz?
      start_here: Empieza aquí
      transcription:
        description: Recomendamos <b>Deepgram STT</b> para una transcripción
          ultrarrápida en la nube. Para uso local, <b>Web Speech API</b>
          (Navegador) o <b>Local Whisper</b> son excelentes opciones gratuitas.
        title: ¿Voz a texto?
      vision:
        description: Usa <b>Google Gemini</b> para una visión potente y gratuita en la
          nube. Las opciones locales como <b>Ollama</b> y <b>LM Studio</b>
          también admiten modelos con visión (VLM).
        title: ¿Ver el mundo?
      motion:
        title: ¿Gestos y cinética 3D?
        description: Sintetiza movimientos y gestos de personajes VRM en 3D en tiempo
          real en el dispositivo usando difusión generativa <b>FlowMDM (WebGPU
          local)</b>.
      cloud:
        title: ¿Sincronización en la nube y copias de seguridad?
        description: Mantén tus tarjetas, archivos de memoria y configuraciones seguras
          entre dispositivos. Usa el <b>Sistema de archivos local</b> para
          copias en escritorio/NAS o <b>Almacenamiento compatible con S3</b>
          (Cloudflare R2, MinIO, AWS S3).
