              se detecta automáticamente). bf16/f32 se convierten a f16 al
              cargar. Los archivos .pth de PyTorch no son compatibles;
              conviértelos primero a safetensors (convert_safetensors.py).
            label: URL del modelo
          vocab:
            description: Reemplaza el vocabulario del tokenizador RWKV World integrado. Si
              estás utilizando un modelo ajustado para otro idioma o mapeo de
              tokens personalizado, proporcionar su URL JSON de vocabulario
              garantiza la codificación correcta y un comportamiento óptimo.
            label: URL del vocabulario (opcional)
            placeholder: (integrado rwkv_vocab_v20230424.json)
        title: RWKV (Local, WebGPU)
      whisper-local:
        description: STT local usando Whisper (se ejecuta en tu navegador, sin clave de API)
        title: Whisper (Local)
    title: Proveedores
