    capabilities:
      Hearing:
        title: Hearing
        description: Listens to your voice and turns speech into text for natural spoken
          conversation.
        bullets:
          '0': Real-time speech transcription
          '1': Voice activity / pause detection
          '2': Continuous listening or push-to-talk
      Voice:
        title: Voice
        description: Lets your companion speak aloud with a natural, expressive voice.
        bullets:
          '0': Neural text-to-speech
          '1': Voice, speed, and pitch controls
          '2': Captions and avatar lip-sync
      Pacing:
        title: Pacing
        description: Keeps conversations flowing naturally while responses are being
          prepared.
        bullets:
          '0': Natural fillers and acknowledgements
          '1': Brief transition phrases during longer responses
          '2': Faster, smoother conversational turn-taking
      Emotions:
        title: Emotions
        description: Turns conversational emotion into live avatar expressions and body
          language.
        bullets:
          '0': Facial expressions and emotion cues
          '1': Avatar gestures and body language
          '2': Mood that can carry across the conversation
      Memory:
        title: Memory
        description: Carries useful context across conversations so your companion can
          remember past interactions.
        bullets:
          '0': Daily summaries of recent conversations
          '1': Searchable journal of important memories
          '2': Connections between people, places, and topics
      Vision:
        title: Vision
        description: Lets your companion understand images, photos, and screenshots you
          share.
        bullets:
          '0': Image and scene understanding
          '1': Object, text, and detail recognition
          '2': Follow-up discussion about visual content
      Presence:
        title: Presence
        description: Lets your companion check in and react on its own instead of always
          waiting for you to start the conversation.
        bullets:
          '0': Scheduled routines and timers
          '1': Proactive casual check-ins
          '2': Context-aware commentary on screen activity
      Visuals:
        title: Visuals
        description: Lets your companion create artwork and visual scenes as part of the
          conversation.
        bullets:
          '0': AI image generation
          '1': Visual-novel scenes and selfies
          '2': Illustrated memory journal
      Tools:
        title: Tools
        description: Lets your companion use external tools, browse information, and
          interact with your workspace.
        bullets:
          '0': Web search and page reading
          '1': Local workspace access
          '2': Connected services and custom tools
      Text:
        title: Text
        description: Provides a lightweight, keyboard-first way to chat without voice
          features.
        bullets:
          '0': Markdown and code formatting
          '1': Streaming text responses
