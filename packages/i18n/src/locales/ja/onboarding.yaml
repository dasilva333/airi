  triage:
    label: アカウント
    subtitle: アカウントサインインと構成
    title: アカウントサインインと構成
    description: お手元のマシンで完全にオフライン動作させるか、アカウントを連携してシームレスなクラウド同期とバックアップを利用するかを選択します。
    zeroTrustBadge: ゼロトラスト
    localOption:
      title: ローカルパートナー (完全オフライン)
      description: 100%
        オフライン＆プライベート。すべてのキャラクターカード、記憶、ステータスはローカルデータベースにのみ保存され、クラウドテレメトリは一切送信されません。
      badge: オフライン優先
      action: ローカルで続ける
    cloudOption:
      title: アカウントサインイン (Cloudflare)
      description: アカウントを連携し、エンドツーエンドの暗号化でデバイス間のパートナー、設定、記憶保管庫を同期します。
      badge: マルチデバイス同期
      connect: Cloudflare でサインイン
      connected: Cloudflare に接続済み
      accountPrefix: 'アカウント ID:'
    restore:
      foundCompanions: Cloudflare R2 に {count} 体のパートナーが見つかりました
      restoreAndLaunch: 復元してステージを起動 (~30秒)
      restoreAndBuild: 復元して別のコンパニオンを作成
      syncing: リモートパートナーを復元中...
      bannerTitle: リモートバックアップを検出
      bannerDesc: Cloudflare R2 保管庫に {count} 体のコンパニオンが見つかりました。
      restoring: コンパニオンを復元中...
      restoreAll: 復元してステージを起動
    stepBadge: アーキテクチャトリアージ · ステップ {current} / {total}
    companionGreeting: AIRI
      へようこそ！ステージのセットアップ方法を選択してください。完全ローカル・オフラインで動作させることも、アカウントにサインインして複数デバイス間で同期することも可能です。
    local:
      badge: オフライン優先
      title: ローカルコンパニオン (完全隔離)
      description: 100% オフライン＆プライベート。すべてのキャラクターカード、記憶、状態はローカルに保存され、外部クラウド通信は一切行いません。
      selectedCta: 選択中 (ローカルモード)
      selectCta: ローカルモードを選択
      features:
        f1: 端末内完全オフライン保存
        f2: クラウドテレメトリ・外部通信ゼロ
        f3: ローカルDBによる超高速起動
      continueAction: Continue locally
      noSignInNeeded: No sign-in needed.
    cloud:
      badge: 10 GB 無料 + クラウド同期
      title: アカウントサインイン (Cloudflare)
      description: アカウントを接続して、10 GB の無料ストレージ、毎日のエッジ AI クレジット、複数デバイス間での 24/7 コンパニオン常駐を有効にします。
      selectedCta: 選択中 (クラウド連携)
      selectCta: クラウド同期を選択
      features:
        f1: 10 GB 無料クラウドストレージ
        f2: 毎日の無料エッジ AI クレジット
        f3: 24/7 Discord クラウドリレー
        f4: 複数デバイス同期＆1クリック復元
        f5: プライベート CORS プロキシ＆ゼロカストディ
        storage:
          title: 10 GB 無料クラウドストレージ
          desc: 3Dモデル、カスタム背景、完全な記憶保管庫を下り転送手数料ゼロでバックアップします。
          howItWorks: ユーザー所有の Cloudflare R2 オブジェクトストレージを活用しています。
          whyItMatters: 数十の VRM/Live2D モデルや数年分のチャット履歴を保存できる十分な無料枠を提供します。AWS S3
            と異なり、アセットのダウンロードは帯域料金 $0 で 100% 無料です。
        ai:
          title: 毎日の無料エッジ AI クレジット
          desc: DeepSeek、Qwen、Llama 用に毎日 10,000 ニューロンを無料提供（API キー不要）。
          howItWorks: ステップ 8（意識）で Cloudflare Workers AI に直接接続します。
          whyItMatters: OpenAI の有料サブスクやクレジットカード、高価なローカルゲーミング GPU
            がなくても、最先端のオープンモデルとエッジで即座に会話できます。
        relay:
          title: 24/7 Discord クラウドリレー
          desc: PC の電源を切っても、Discord サーバーでコンパニオンが常時アクティブに待機します。
          howItWorks: サーバーレスの Cloudflare Worker (@proj-airi/stage-edge) として動作し、Discord
            インタラクション Webhook を処理します。
          whyItMatters: コンパニオンが 24 時間体制でチャットに応答し、Edge KV に記憶を蓄積、AIRI を再起動した際にデスクトップへ自動同期します。
        sync:
          title: 複数デバイス同期＆1クリック復元
          desc: デスクトップ、Web、モバイルをシームレスに同期。ワンクリックでコンパニオンを復元できます。
          howItWorks: Edge Key Vault (airi-edge-vault) がアクティブなコンパニオン状態を安全に保持します。
          whyItMatters: AIRI の再インストールや新しいノート PC /
            スマートフォンへの移行時も、手動でキーを入力することなくコンパニオン、設定、記憶を自動復元します。
        proxy:
          title: プライベート CORS プロキシ＆ゼロカストディ
          desc: 完全なゼロカストディのデータプライバシーで、複雑なローカルおよびリモート AI API にアクセスします。
          howItWorks: 個人用エッジリバースプロキシをデプロイし、Web およびモバイルステージ向けのブラウザ CORS 制限を回避します。
          whyItMatters: すべてが個人の Cloudflare アカウント内で動作します。AIRI
            は中間サーバーを介さず、会話を盗み見たり保存したりすることは一切ありません。
      signInAction: Sign in & continue
      signInHelp: Sign in with Cloudflare to continue.
