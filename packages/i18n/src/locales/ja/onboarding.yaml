  experience:
    label: 体験
    subtitle: インタラクション類型
    title: インタラクションアーキタイプ
    description: パートナーとの関わり方のプリセットを選択します。必要のないモジュールやステップが自動的に整理されます。
    archetypes:
      quietObserver:
        title: 静かな観察者 (Quiet Observer)
        tag: 最速 · ミニマリスト
        description: 軽快なテキストパートナー。アバターは表情豊かに反応し、思考と長期記憶を持ちながら、音声や視覚の負荷はゼロです。
      casualCompanion:
        title: 親愛なるパートナー (Casual Companion)
        tag: 一番人気
        description: 王道の音声＆ビジュアルパートナー。自然な会話音声 (STT/TTS)、チャット画像認識 (VLM)、自然な間合いと長期記憶。
      creativeMuse:
        title: 創作のミューズ (Creative Muse)
        tag: ビジュアル・アート重視
        description: 創作インスピレーションのスタジオ。肉声での対話、自律的な画像生成 (Pollinations/ComfyUI)、画像理解、豊かな表情変化。
      executiveCopilot:
        title: エグゼクティブコパイロット
        tag: 高い生産性
        description: デスクワークに特化。音声対話、デスクトップ画面把握、ウィンドウ履歴、ローカルファイル操作 MCP、Web検索。
      ambientRoommate:
        title: ルームメイト (Ambient Roommate)
        tag: 自律的な存在感
        description: 日常生活を共にする存在。音声対話、環境ハートビートによる自発的な声かけ、おやすみスケジュール、画面見守り。
      swissArmy:
        title: オールインワン (Swiss Army)
        tag: 全機能搭載 · フル装備
        description: 最高峰のフルスペック体験：双方向音声認識、画像分析、画面見守り、自発的対話、アート生成、外部ツール、4象限記憶。
      quiet:
        title: 静かな観察者
        badge: ⚡ 最速 · ミニマリスト
        subtitle: テキスト・ツール・記憶
        description: 音声オーバーヘッドゼロ。アバターの表情、思考の間、長期記憶を備えた超高速テキストコンパニオン。
      casual:
        title: カジュアルコンパニオン
        badge: ✨ 人気の選択肢
        subtitle: 音声対話 & 画像認識
        description: リアルタイム音声認識(STT)、表現豊かな音声(TTS)、画像認識、自然な会話テンポ、長期記憶。
      muse:
        title: クリエイティブミューズ
        badge: 🎨 ビジュアルフォーカス
        subtitle: 音声・視覚・画像生成
        description: 音声対話、画像生成(Pollinations/ComfyUI)、チャット画像認識、表情豊かなモーフィング。
      copilot:
        title: エグゼクティブコパイロット
        badge: 💼 プロダクティビティ
        subtitle: 音声 + アクションツール
        description: 音声対話、デスクトップ画面監視、ローカルファイルMCPツール、リアルタイムWeb検索。
      roommate:
        title: アンビエントルームメイト
        badge: 🌙 自律的な存在感
        subtitle: 日常ルーティン & 寄り添い
        description: 音声対話、環境ハートビート、睡眠スケジュール、クワイエットアワー、画面認識。
      swiss-army:
        title: 万能アーミーナイフ
        badge: 🔥 全機能 · オールインワン
        subtitle: 音声・視覚・アクション
        description: すべてを備えた最高峰コンパニオン。聴覚、ニューラル音声、思考テンポ、2パスACT表情、画面認識、アート生成、認知記憶階層。
    advanced:
