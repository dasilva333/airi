        vision: 視覚 (チャット画像認識・分析)
        screen: 画面 (デスクトップ観察とOCR)
        proactivity: 自発性 (日常スケジュールと自発対話)
        artistry: アート生成 (画像生成と自律ディレクター)
        memory: 記憶体系 (4象限認知メモリ)
        tools: 外部ツール (Web検索とデスクトップMCP)
