    local:
      badge: Offline First
      title: Local only
      description: Keep companion cards, memories, and settings on this device.
      selectedCta: Selected (Air-Gapped)
      selectCta: Choose Local Mode
      features:
        f1: 100% offline on-device storage
        f2: Zero cloud telemetry or external network calls
        f3: Instant startup with local database
      continueAction: Continue locally
      noSignInNeeded: No sign-in needed.
      bullets:
        storage:
          title: On-device storage
          desc: Data stays in your local database.
        account:
          title: No account required
          desc: Start without signing in.
        setup:
          title: Simple local setup
          desc: Manage your companion on this device.
      details:
        storage:
          title: On-Device Database Storage
          desc: All companion cards, transcripts, and memory journals are stored strictly
            in your local IndexedDB and disk vaults. Zero data ever leaves your
            computer.
        telemetry:
          title: Zero Telemetry & Custody
          desc: No accounts, no email addresses, no tracking cookies, and no telemetry
            pingbacks. Complete anonymity and zero-custody data sovereignty.
          badge: 100% Air-Gapped
        compute:
          title: Bring-Your-Own Compute
          desc: Run Kokoro TTS, Whisper STT, and Ollama / LM Studio / WebLLM completely
            offline using your device’s local CPU and GPU acceleration.
          badge: WebGPU & Local LLM
        export:
          title: Portable Open Formats
          desc: Export your companions and memories anytime as standard PNG chunks or raw
            JSON. No proprietary format lock-in or cloud dependencies.
          badge: CCv3 / PNG Chunks
        architectureTitle: Air-Gapped Local Architecture
        architectureDescription: 100% on-device execution. Your companion stays
          completely private to this machine.
    cloud:
      badge: 10 GB Free + Cloud Sync
      title: Connected account
      description: Powered by Cloudflare · Use an account for backup, sync, and hosted
        services.
      selectedCta: Selected (Cloud-Backed)
      selectCta: Choose Cloud Sync
      features:
        f1: 10 GB Free Cloud Storage
        f2: Free Daily Edge AI Credits
        f3: 24/7 Discord Cloud Relay
        f4: Multi-Device Sync & 1-Click Restore
        f5: Private CORS Proxy & Zero-Custody
        storage:
          title: 10 GB Free Object Storage
          desc: Back up 3D models, custom backgrounds, and full memory vaults with zero
            egress fees.
          howItWorks: Powered by user-owned Cloudflare R2 object storage.
          whyItMatters: Generous free tier with zero egress fees. Safely backs up 3D/VRM
            vessels, Live2D assets, custom backgrounds, and entire memory
            hierarchies across devices.
        ai:
          title: 10,000 Free Daily Edge AI Credits
          desc: 10,000 free daily Neurons for DeepSeek, Qwen & Llama (no API key
            required).
          howItWorks: Directly connects to Cloudflare Workers AI during Step 8
            (Consciousness).
          whyItMatters: Direct connection to Cloudflare’s global edge GPU fleet. Chat with
            DeepSeek-R1, Qwen 2.5, and Llama 3 without paid API keys or
            dedicated graphics cards.
        relay:
          title: 24/7 Discord Serverless Relay
          desc: Keep your companion awake in your Discord server even when your PC is
            turned off.
          howItWorks: Runs as a serverless Cloudflare Worker ({'@'}proj-airi/stage-edge)
            handling Discord interaction webhooks.
          whyItMatters: A serverless Cloudflare Worker keeps your companion awake in your
            Discord server 24/7, syncing conversations back to desktop when you
            reopen AIRI.
        sync:
          title: Multi-Device Sync & 1-Click Restore
          desc: Seamlessly sync Desktop, Web, and Mobile; restore companions in one click.
          howItWorks: Edge Key Vault (airi-edge-vault) securely tracks your active
            companion state.
          whyItMatters: Encrypted Edge Key Vault securely synchronizes Desktop, Web, and
            Mobile companions, enabling one-click instant recovery on any new
            machine.
        proxy:
          title: Private CORS Proxy & Zero-Custody
          desc: Access tricky local & remote AI APIs with 100% zero-custody data privacy.
          howItWorks: Deploys a personal edge reverse proxy to bypass browser CORS headers
            for Web & Mobile stages.
          whyItMatters: Deploys a personal edge reverse proxy allowing Web and Pocket
            mobile stages to bypass browser CORS headers. Everything runs in
            your personal account.
      signInAction: Sign in & continue
      signInHelp: Sign in with Cloudflare to continue.
      useApiToken: Use API token
      waitingForSignIn: Waiting for sign-in...
      cancelSignIn: Cancel sign-in
      finishInBrowser: Finish signing in in your browser.
