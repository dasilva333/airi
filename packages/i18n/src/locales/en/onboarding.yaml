      continue: Continue Setup
      closeToTray: Close to Tray

  triage:
    label: Account
    subtitle: Account Sign-In & Architecture
    title: Account Sign-In & Architecture
    description: Choose whether to run completely air-gapped on this machine, or
      connect an account for seamless cloud synchronization and backups.
    zeroTrustBadge: Zero-Trust
    localOption:
      title: Local Companion (Air-Gapped)
      description: 100% offline and private. All companion cards, memories, and state
        are stored locally in your browser/desktop database with zero cloud
        telemetry.
      badge: Offline First
      action: Continue Locally
    cloudOption:
      title: Account Sign-In (Cloudflare)
      description: Connect your account to sync companions, settings, and memory
        vaults across devices with end-to-end encryption.
      badge: Multi-Device Sync
      connect: Sign In with Cloudflare
      connected: Connected to Cloudflare
      accountPrefix: 'Account ID:'
    restore:
      foundCompanions: Found {count} companion(s) in Cloudflare R2
      restoreAndLaunch: Restore & Launch Stage (~30s)
      restoreAndBuild: Restore & Build Another Companion
      syncing: Restoring remote companions...
      bannerTitle: Remote Backups Found
      bannerDesc: Found {count} companion(s) in your Cloudflare R2 vault.
      restoring: Restoring companions...
      restoreAll: Restore & Launch Stage
    stepBadge: Architecture Triage · Step {current} of {total}
    companionGreeting: Welcome to AIRI! Choose how you'd like to set up your stage.
      You can run 100% locally and offline, or sign in to sync across devices.
    local:
      badge: Offline First
      title: Local Companion (Air-Gapped)
      description: 100% offline and private. All companion cards, memories, and state
        are stored locally in your browser/desktop database with zero cloud
        telemetry.
      selectedCta: Selected (Air-Gapped)
      selectCta: Choose Local Mode
      features:
        f1: 100% offline on-device storage
        f2: Zero cloud telemetry or external network calls
        f3: Instant startup with local database
    cloud:
      badge: 10 GB Free + Cloud Sync
      title: Account Sign-In (Cloudflare)
      description: Connect your account to unlock 10 GB of free storage, daily edge AI
        credits, and 24/7 companion presence across devices.
      selectedCta: Selected (Cloud-Backed)
      selectCta: Choose Cloud Sync
      features:
        f1: 10 GB Free Cloud Storage
        f2: Free Daily Edge AI Credits
        f3: 24/7 Discord Cloud Relay
        f4: Multi-Device Sync & 1-Click Restore
        f5: Private CORS Proxy & Zero-Custody
        storage:
          title: 10 GB Free Cloud Storage
          desc: Back up 3D models, custom backgrounds, and full memory vaults with zero
            egress fees.
          howItWorks: Powered by user-owned Cloudflare R2 object storage.
          whyItMatters: Generous free tier with plenty of room for dozens of VRM/Live2D
            models and years of chat history. Unlike AWS S3, downloading your
            assets is 100% free with $0 bandwidth fees.
        ai:
          title: Free Daily Edge AI Credits
          desc: 10,000 free daily Neurons for DeepSeek, Qwen & Llama (no API key
            required).
          howItWorks: Directly connects to Cloudflare Workers AI during Step 8
            (Consciousness).
          whyItMatters: Chat immediately with cutting-edge open models at the edge without
            needing an OpenAI subscription, paid credit card, or a high-end
            local gaming GPU.
        relay:
          title: 24/7 Discord Cloud Relay
          desc: Keep your companion awake in your Discord server even when your PC is
            turned off.
          howItWorks: Runs as a serverless Cloudflare Worker (@proj-airi/stage-edge)
            handling Discord interaction webhooks.
          whyItMatters: Your companion stays alive 24/7 to chat in Discord, stores context
            in Edge KV, and syncs conversations back to your desktop when you
            reopen AIRI.
        sync:
          title: Multi-Device Sync & 1-Click Restore
          desc: Seamlessly sync Desktop, Web, and Mobile; restore companions in one click.
          howItWorks: Edge Key Vault (airi-edge-vault) securely tracks your active
            companion state.
          whyItMatters: Reinstalling AIRI or moving to a new laptop/phone automatically
            brings back your companion, settings, and memories without manual
            key entry.
        proxy:
          title: Private CORS Proxy & Zero-Custody
          desc: Access tricky local & remote AI APIs with 100% zero-custody data privacy.
          howItWorks: Deploys a personal edge reverse proxy to bypass browser CORS headers
            for Web & Mobile stages.
          whyItMatters: Everything runs in your personal Cloudflare account. AIRI operates
            zero intermediate servers and never reads, stores, or harvests your
            conversations.
    auth:
      connected: Connected to Cloudflare
      disconnect: Disconnect
      autoTab: 1-Click Browser
      tokenTab: API Token
      verifying: Verifying...
      oauthButton: Sign In with Cloudflare
      tokenPlaceholder: Paste your Cloudflare API token...
      verifyToken: Connect Token

  appearance:
    label: Appearance
    subtitle: Language, Theme & Accent
    title: Language & Appearance
    description: Set your interface language, visual theme, and signature accent color.
    languageSection:
      title: Interface language
      description: Select your primary language for AIRI. You can change this anytime.
    themeSection:
      title: Theme
      description: Choose your preferred appearance mode.
      dark: Dark
      light: Light
      system: System Synchronized
      darkDesc: Deep obsidian tones
      lightDesc: Bright daylit studio
    colorSection:
      title: Accent color
      description: Choose an accent tone to personalize buttons, highlights, and
        avatar glow effects.
      defaultColor: Reset to cyan
      custom: Custom Hex
