              trữ tùy chỉnh không có tệp nhị phân WASM sẽ trả về lỗi 404 khi
              chạy.
            label: URL WASM model_lib tùy chỉnh (bắt buộc đối với kho lưu trữ tùy chỉnh)
            placeholder: https://.../custom-model_q4f16_1_cs1k-webgpu.wasm
          model:
            description: Mô hình WebLLM đã được kiểm chứng từ danh mục tích hợp sẵn (bao gồm
              thư viện WASM phù hợp).
            label: Mô hình tuyển chọn
          temperature:
            description: Nhiệt độ lấy mẫu (càng cao = càng sáng tạo).
            label: Nhiệt độ
          topP:
            description: Ngưỡng lấy mẫu hạt nhân (khối lượng xác suất).
            label: Top P
