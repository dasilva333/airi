            clear: Xóa bộ nhớ đệm WebLLM
            clearing: Đang xóa...
            description: Trọng số đã tải xuống và thư viện WASM được lưu trong Bộ nhớ đệm
              trình duyệt (webllm/*).
            notCached: Không có trọng số WebLLM nào được lưu trong bộ nhớ đệm
            refresh: Làm mới
            title: Bộ nhớ đệm trọng số
          model:
            description: Chọn một mô hình được tuyển chọn hoặc thêm kho lưu trữ Hugging Face
              MLC tùy chỉnh bên dưới.
            title: Mô hình
        title: WebLLM (Cục bộ, WebGPU)
      web-rwkv:
        alert:
          content: RWKV chạy hoàn toàn trong trình duyệt của bạn qua WebGPU — không cần
            khóa API, không cần máy chủ. Mô hình sẽ tải xuống trong lần sử dụng
            đầu tiên và được lưu vào bộ nhớ đệm; trọng số bf16/f32 tự động
            chuyển thành f16 khi tải. Yêu cầu trình duyệt hoặc Electron hỗ trợ
            WebGPU (không có dự phòng CPU/WASM).
          title: LLM trong trình duyệt chỉ dùng WebGPU
        defaultsSection:
          annotation: 'Để tùy chỉnh các cài đặt này cho nhân vật, hãy chuyển đến tab Tạo
            của nhân vật: • Sửa đổi Nhiệt độ, Top P và Số lượng token tối đa
            bằng các trường nhập liệu. • Sửa đổi hình phạt (Hiện diện/Đếm/Suy
            giảm) bằng cách nhập chúng vào vùng văn bản JSON nâng cao (ví dụ:
            "presence_penalty": 0.5).'
          description: Đây là các thông số dự phòng mặc định được sử dụng bởi web-rwkv.
          field:
            count_penalty: 'Hình phạt tần suất Count Penalty (Mặc định: 0.4)'
            max_tokens: 'Số token tối đa Max Tokens (Mặc định: 512)'
            penalty_decay: 'Mức giảm hình phạt Penalty Decay (Mặc định: 0.996)'
            presence_penalty: 'Hình phạt hiện diện Presence Penalty (Mặc định: 0.4)'
            temperature: 'Nhiệt độ Temperature (Mặc định: 1.0)'
            top_p: 'Top P (Mặc định: 0.5)'
          title: Thông số tạo mặc định (Chỉ đọc)
        description: LLM RWKV-7 cục bộ trong trình duyệt của bạn qua WebGPU (không cần
          khóa API)
        fields:
          enableG1Prefill:
            description: 'Điền sẵn <think></think> vào lượt của trợ lý để giữ các mô hình
              suy luận G1 ở chế độ đã huấn luyện và loại bỏ thẻ đóng mở đầu khi
              xuất dữ liệu. Tắt tính năng này nếu sử dụng các mô hình không phải
              G1 (ví dụ: RWKV-6/5).'
            label: Bật tính năng điền trước và loại bỏ thẻ suy luận G1
          model:
            description: URL .safetensors có tên tensor gốc của RWKV — có thể là bản chuyển
              đổi cho web-rwkv hoặc định dạng thô từ HuggingFace (bố cục được tự
              động phát hiện). bf16/f32 sẽ chuyển thành f16 khi tải. Định dạng
              .pth của PyTorch không được hỗ trợ; vui lòng chuyển đổi sang
              safetensors trước (convert_safetensors.py).
            label: URL mô hình
          vocab:
            description: Ghi đè từ vựng của bộ mã hóa RWKV World đi kèm. Nếu bạn đang dùng
              mô hình tinh chỉnh cho ngôn ngữ khác hoặc ánh xạ token tùy chỉnh,
              cung cấp URL JSON từ vựng ở đây sẽ đảm bảo mã hóa và hành vi tạo
              văn bản chính xác.
            label: URL từ vựng (tùy chọn)
            placeholder: (tích hợp sẵn rwkv_vocab_v20230424.json)
        title: RWKV (Cục bộ, WebGPU)
      whisper-local:
        description: Chuyển lời nói thành văn bản cục bộ dùng Whisper (chạy trong trình
          duyệt của bạn, không cần khóa API)
        title: Whisper (Cục bộ)
