        cache:
          clear: Xóa bộ nhớ đệm WebLLM
          description: Trọng số đã tải xuống và thư viện WASM được lưu trong Bộ nhớ đệm
            trình duyệt (webllm/*).
          title: Bộ nhớ đệm trọng số
        description: LLM Transformer ngoại tuyến tích hợp trong trình duyệt qua WebGPU
          (không cần khóa API)
        fields:
          customRepo:
            description: 'Kho lưu trữ Hugging Face với trọng số được lượng tử hóa MLC (ví
              dụ: my-org/custom-llama3-MLC). Ghi đè lên lựa chọn mặc định.'
