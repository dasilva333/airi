      trayItem: Thiết lập & Đăng nhập bạn đồng hành (V3)
      continue: Tiếp tục thiết lập
      closeToTray: Thu nhỏ vào khay

  triage:
    label: Tài khoản
    subtitle: Đăng nhập & Cấu trúc hệ thống
    title: Đăng nhập tài khoản & Cấu trúc hệ thống
    description: Chọn chạy hoàn toàn cách ly ngoại tuyến trên máy tính này, hoặc
      liên kết tài khoản để đồng bộ và sao lưu đám mây liền mạch.
    zeroTrustBadge: Zero-Trust
    localOption:
      title: Bạn đồng hành nội bộ (Cách ly / Ngoại tuyến)
      description: 100% ngoại tuyến và riêng tư. Mọi thẻ nhân vật, ký ức và trạng thái
        chỉ lưu trong cơ sở dữ liệu trên máy bạn mà không gửi dữ liệu ra ngoài.
      badge: Ưu tiên nội bộ
      action: Tiếp tục trên máy
    cloudOption:
      title: Đăng nhập tài khoản (Cloudflare)
      description: Kết nối tài khoản để đồng bộ bạn đồng hành, cài đặt và kho lưu trữ
        ký ức giữa các thiết bị với mã hóa đầu cuối.
      badge: Đồng bộ đa thiết bị
      connect: Đăng nhập với Cloudflare
      connected: Đã kết nối Cloudflare
      accountPrefix: 'ID tài khoản:'
    restore:
      foundCompanions: 'Tìm thấy {count} bạn đồng hành trên Cloudflare R2'
      restoreAndLaunch: Khôi phục & Khởi chạy sân khấu (~30 giây)
      restoreAndBuild: Khôi phục & Tạo bạn đồng hành khác
      syncing: Đang khôi phục dữ liệu từ xa...
      bannerTitle: Tìm thấy bản sao lưu từ xa
      bannerDesc: Tìm thấy {count} bạn đồng hành trong kho Cloudflare R2 của bạn.
      restoring: Đang khôi phục bạn đồng hành...
      restoreAll: Khôi phục & Khởi chạy sân khấu
    stepBadge: Phân loại kiến trúc · Bước {current} / {total}
    companionGreeting: Chào mừng bạn đến với AIRI! Hãy chọn cách bạn muốn thiết lập
      sân khấu của mình. Bạn có thể chạy hoàn toàn cục bộ ngoại tuyến hoặc đăng
      nhập để đồng bộ hóa trên nhiều thiết bị.
    local:
      badge: Ưu tiên ngoại tuyến
      title: Bạn đồng hành cục bộ (Biệt lập)
      description: 100% ngoại tuyến và riêng tư. Tất cả thẻ nhân vật, ký ức và trạng
        thái được lưu trữ cục bộ, không có dữ liệu từ xa lên đám mây.
      selectedCta: Đã chọn (Cục bộ)
      selectCta: Chọn chế độ cục bộ
      features:
        f1: Lưu trữ 100% ngoại tuyến trên thiết bị
        f2: Không có dữ liệu đo từ xa hoặc kết nối ngoài
        f3: Khởi động tức thì với cơ sở dữ liệu cục bộ
      continueAction: Continue locally
      noSignInNeeded: No sign-in needed.
    cloud:
      badge: 10 GB Miễn phí + Đồng bộ Đám mây
      title: Đăng nhập tài khoản (Cloudflare)
      description: Kết nối tài khoản của bạn để mở khóa 10 GB dung lượng lưu trữ miễn
        phí, tín dụng AI edge hàng ngày và sự hiện diện 24/7 của bạn đồng hành
        trên các thiết bị.
      selectedCta: Đã chọn (Đám mây)
      selectCta: Chọn đồng bộ đám mây
      features:
        f1: 10 GB lưu trữ đám mây miễn phí
        f2: Tín dụng Edge AI miễn phí hàng ngày
        f3: Tiếp sức đám mây Discord 24/7
        f4: Đồng bộ đa thiết bị & Khôi phục 1 lần nhấp
        f5: Proxy CORS riêng tư & Không lưu giữ dữ liệu
        storage:
          title: 10 GB lưu trữ đám mây miễn phí
          desc: Sao lưu mô hình 3D, hình nền tùy chỉnh và toàn bộ kho lưu trữ ký ức mà
            không mất phí truyền tải ra ngoài.
          howItWorks: Được hỗ trợ bởi bộ lưu trữ đối tượng Cloudflare R2 thuộc sở hữu của
            người dùng.
          whyItMatters: Gói miễn phí hào phóng với không gian đủ cho hàng chục mô hình
            VRM/Live2D và nhiều năm lịch sử trò chuyện. Không giống như AWS S3,
            tải xuống tài nguyên là 100% miễn phí với $0 phí băng thông.
        ai:
          title: Tín dụng Edge AI miễn phí hàng ngày
          desc: 10.000 Neurons miễn phí mỗi ngày cho DeepSeek, Qwen & Llama (không yêu cầu
            khóa API).
          howItWorks: Kết nối trực tiếp với Cloudflare Workers AI trong Bước 8 (Ý thức).
          whyItMatters: Trò chuyện ngay với các mô hình nguồn mở tiên tiến ở rìa mạng mà
            không cần đăng ký OpenAI trả phí, thẻ tín dụng hoặc card đồ họa chơi
            game đắt đỏ.
        relay:
          title: Tiếp sức đám mây Discord 24/7
          desc: Giữ cho bạn đồng hành luôn thức trên máy chủ Discord ngay cả khi máy tính
            của bạn đã tắt.
          howItWorks: Chạy dưới dạng Cloudflare Worker không máy chủ
            (@proj-airi/stage-edge) xử lý webhook tương tác Discord.
          whyItMatters: Bạn đồng hành luôn sẵn sàng 24/7 để trò chuyện trên Discord, lưu
            trữ ngữ cảnh trong Edge KV và đồng bộ các cuộc trò chuyện về máy
            tính khi bạn mở lại AIRI.
        sync:
          title: Đồng bộ đa thiết bị & Khôi phục 1 lần nhấp
          desc: Đồng bộ hóa liền mạch Máy tính, Web và Di động; khôi phục bạn đồng hành
            chỉ bằng một cú nhấp chuột.
          howItWorks: Kho khóa Edge Key Vault (airi-edge-vault) theo dõi an toàn trạng
            thái hoạt động của bạn đồng hành.
          whyItMatters: Cài đặt lại AIRI hoặc chuyển sang máy tính xách tay/điện thoại mới
            sẽ tự động khôi phục bạn đồng hành, cài đặt và ký ức mà không cần
            nhập khóa thủ công.
        proxy:
          title: Proxy CORS riêng tư & Không lưu giữ dữ liệu
          desc: Truy cập các API AI cục bộ & từ xa phức tạp với quyền riêng tư dữ liệu
            không lưu giữ 100%.
          howItWorks: Triển khai proxy ngược biên cá nhân để vượt qua tiêu đề CORS của
            trình duyệt cho các phiên bản Web & Di động.
          whyItMatters: Mọi thứ đều chạy trong tài khoản Cloudflare cá nhân của bạn. AIRI
            không vận hành máy chủ trung gian và không bao giờ đọc, lưu trữ hoặc
            thu thập các cuộc trò chuyện của bạn.
      signInAction: Sign in & continue
      signInHelp: Sign in with Cloudflare to continue.
      useApiToken: Use API token
      waitingForSignIn: Waiting for sign-in...
      cancelSignIn: Cancel sign-in
      finishInBrowser: Finish signing in in your browser.
      continueAction: Continue with connected account
      manageConnection: Manage connection
    auth:
      connected: Đã kết nối với Cloudflare
      disconnect: Ngắt kết nối
      autoTab: Trình duyệt 1 lần nhấp
      tokenTab: Mã thông báo API
      verifying: Đang xác minh...
      oauthButton: Đăng nhập bằng Cloudflare
      tokenPlaceholder: Dán mã thông báo API Cloudflare...
      verifyToken: Kết nối mã
    changeLater: You can change this later.
    moreDetails: More details

  appearance:
    label: Giao diện
    subtitle: Ngôn ngữ, chủ đề & màu sắc
    title: Ngôn ngữ & Diện mạo trực quan
    description: Tùy chỉnh ngôn ngữ hiển thị giao diện, chủ đề sáng tối và màu sắc
      điểm nhấn đặc trưng của bạn.
    languageSection:
      title: Ngôn ngữ hiển thị
      description: Chọn ngôn ngữ chính cho AIRI. Bạn có thể thay đổi bất cứ lúc nào.
    themeSection:
      title: Chế độ chủ đề
      description: Chọn chế độ hiển thị bạn yêu thích.
      dark: Tối
      light: Sáng
      system: Theo hệ thống
      darkDesc: Tông màu obsidian trầm ấm
      lightDesc: Không gian studio sáng tự nhiên
    colorSection:
      title: Bảng màu điểm nhấn đặc trưng
      description: Chọn tông màu cá tính để làm nổi bật các nút bấm, viền và hiệu ứng
        hào quang của bạn đồng hành.
      defaultColor: Xanh lơ mặc định
      custom: Mã màu HEX tùy chọn
      groups:
        warm: Ấm áp & Ngọn lửa
        flora: Đất mẹ & Cỏ cây
        ocean: Đại dương & Bầu trời
        royal: Quý phái & Nở rộ
      activeColor: 'Đang chọn: {color}'
    perDeviceToggle: Chỉ lưu diện mạo này trên thiết bị hiện tại (không bị đồng bộ
      đám mây ghi đè)
    companionGreeting: Let’s make this space feel like you. Choose your language, theme, and
      accent color—you’ll see changes as you go.

  experience:
    label: Trải nghiệm
    subtitle: Nguyên mẫu tương tác
    title: Các nguyên mẫu tương tác
    description: Chọn phong cách tương tác định sẵn. Hệ thống sẽ tự động bật các
      tính năng phù hợp và ẩn đi các bước không cần thiết.
    archetypes:
      quietObserver:
        title: Người quan sát thầm lặng (Quiet Observer)
        tag: Nhanh nhất · Tối giản
        description: Bạn đồng hành dạng văn bản siêu nhẹ. Hiện thân vẫn biểu cảm trên
          sân khấu, có suy nghĩ nội tâm và ký ức dài hạn, không tốn tài nguyên
          âm thanh hay hình ảnh.
      casualCompanion:
        title: Bạn đồng hành gần gũi (Casual Companion)
        tag: Phổ biến nhất
        description: Bạn đồng hành giọng nói và hình ảnh chuẩn mực. Giọng nói tự nhiên
          (STT/TTS), nhận diện ảnh trò chuyện (VLM), nhịp điệu chân thực và ký
          ức dài hạn.
      creativeMuse:
        title: Nàng thơ sáng tạo (Creative Muse)
        tag: Tập trung nghệ thuật thị giác
        description: Studio cảm hứng nghệ thuật. Giao tiếp giọng nói, tự vẽ tranh minh
          họa (Pollinations/ComfyUI), thấu hiểu hình ảnh và biểu cảm phong phú.
      executiveCopilot:
        title: Trợ lý điều hành (Executive Copilot)
        tag: Tối ưu năng suất
        description: Dành cho công việc hiệu quả. Đối thoại giọng nói, nhận biết cửa sổ
          màn hình làm việc, công cụ MCP hệ thống tệp nội bộ và tìm kiếm web
          trực tiếp.
      ambientRoommate:
        title: Người bạn chung phòng (Ambient Roommate)
        tag: Hiện diện chủ động
        description: Nhịp sống sinh hoạt thường nhật. Giọng nói ấm áp, nhịp tim môi
          trường chủ động bắt chuyện, giờ ngủ yên tĩnh và quan sát màn hình.
      swissArmy:
        title: Đa năng toàn diện (Swiss Army)
        tag: Đầy đủ tính năng · Trọn gói
        description: 'Trải nghiệm đỉnh cao toàn diện: Giọng nói hai chiều, thị giác AI,
          quan sát màn hình, chủ động tương tác, sáng tạo tranh ảnh, công cụ
          ngoài và ký ức 4 góc phần tư.'
      quiet:
        title: Người quan sát tĩnh lặng
        badge: ⚡ Nhanh nhất · Tối giản
        subtitle: Văn bản, Công cụ & Ký ức
        description: Không tiêu tốn tài nguyên âm thanh, biểu cảm avatar, nhịp suy nghĩ
          và bộ nhớ dài hạn.
      casual:
        title: Bạn đồng hành thường ngày
        badge: ✨ Lựa chọn phổ biến
        subtitle: Đối thoại giọng nói & Thị giác
        description: Nhận dạng giọng nói (STT), giọng đọc cảm xúc (TTS), nhận diện ảnh,
          nhịp điệu tự nhiên và ký ức.
      muse:
        title: Nàng thơ sáng tạo
        badge: 🎨 Tiêu điểm hình ảnh
        subtitle: Giọng nói, Thị giác & Nghệ thuật
        description: Đối thoại giọng nói, tạo ảnh (Pollinations/ComfyUI), thị giác ảnh
          chat và biến đổi biểu cảm avatar.
      copilot:
        title: Trợ lý điều hành
        badge: 💼 Năng suất công việc
        subtitle: Giọng nói + Công cụ hành động
        description: Đối thoại giọng nói, theo dõi màn hình máy tính, công cụ tệp MCP
          cục bộ và tìm kiếm web trực tiếp.
      roommate:
        title: Bạn cùng phòng
        badge: 🌙 Hiện diện chủ động
        subtitle: Thói quen sống & Hiện diện
        description: Giọng nói, nhịp thở môi trường, lịch ngủ, giờ yên tĩnh và nhận biết
          màn hình.
      swiss-army:
        title: Dao đa năng Thụy Sĩ
        badge: 🔥 Đầy đủ tính năng · Tất cả trong một
        subtitle: Giọng nói, Thị giác & Hành động
        description: Bạn đồng hành toàn năng đỉnh cao. Lắng nghe, giọng nói nơ-ron, nhịp
          suy nghĩ, biểu cảm ACT 2 giai đoạn, theo dõi màn hình, vẽ tranh và ký
          ức nhận thức.
    advanced:
      toggle: 'Nâng cao: Tùy chỉnh từng mô-đun riêng lẻ'
      description: Bật hoặc tắt thủ công các mô-đun giác quan và nhận thức theo ý bạn.
      modules:
        hearing: Thính giác (Chuyển giọng nói micro thành văn bản)
        speech: Phát âm (Tổng hợp giọng nói nơ-ron)
        thinking: Suy nghĩ (Điều tiết nhịp điệu và lời thì thầm nội tâm)
        emotions: Cảm xúc (Cầu nối biểu cảm và cử chỉ ACT 2 bước)
        vision: Thị giác (Nhận diện và phân tích ảnh chat)
        screen: Màn hình (Theo dõi màn hình và nhận dạng chữ OCR)
        proactivity: Chủ động (Lịch sinh hoạt và nhịp tim môi trường)
        artistry: Nghệ thuật (Tạo ảnh AI và đạo diễn tự quản)
        memory: Ký ức (Hệ thống ghi nhớ 4 góc phần tư)
        tools: Công cụ (Tìm kiếm web và MCP máy tính)
    hideModules: Ẩn mô-đun
    customizeModules: 'Nâng cao: Tùy chỉnh mô-đun'
    companionGreeting: Choose an archetype that fits your style. Whether you prefer a quiet
      observer, voice companion, or full stage performer, every capability can
      be customized.

