name: 'Release: Linux Desktop'

permissions:
  contents: write
  actions: read

env:
  DEB_BUNDLE_NAME: ''
  RPM_BUNDLE_NAME: ''
  FLATPAK_BUNDLE_NAME: ''
  PRODUCT_NAME: 'airi-dasilva333'
  VERSION: ''

on:
  release:
    types:
      - prereleased
  workflow_dispatch:
    inputs:
      build_only:
        description: Build only
        required: false
        default: false
        type: boolean
      artifacts_only:
        description: Build and upload artifacts only
        required: false
        default: false
        type: boolean
      tag:
        description: Specific tag/commit for the release (leave empty to auto-detect latest tag)
        required: false
        type: string
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    strategy:
      fail-fast: false
      matrix:
        include:

          - os: ubuntu-latest
            artifact: linux-x64
            target: x86_64-unknown-linux-gnu
            builder-args: --linux --x64
            arch: x64

          - os: ubuntu-24.04-arm
            artifact: linux-arm64
            target: aarch64-unknown-linux-gnu
            builder-args: --linux --arm64
            arch: arm64

    runs-on: ${{ matrix.os }}
    steps:
      # Why?
      #
      # failed to build archive at `/home/runner/work/airi/airi/target/x86_64-unknown-linux-gnu/release/deps/libapp_lib.rlib`:
      # No space left on device (os error 28)
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main

      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
      # NOTICE: --ignore-scripts avoids the install-time lifecycle race where
      # packages/i18n `prepare` (needs .bin/tsdown) and model-driver-mediapipe
      # `postinstall` (network download) run before bins/dist exist. The needed
      # steps run explicitly below in dependency order.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # NOTICE: Do NOT use `pnpm rebuild electron` here. Bare rebuild matches
      # nothing (silent 0.4s no-op), and even scoped, electron's install.js
      # repeatedly exited 0 without populating dist (silent skip), deferring
      # the failure to the build step. Download + verify explicitly instead:
      # every stage below fails loudly (curl -f, sha256sum -c, test -x).
      - name: Provision Electron binary
        working-directory: ./apps/stage-tamagotchi
        run: |
          ELECTRON_DIR=$(node -p "require('node:path').dirname(require('node:module').createRequire(process.cwd() + '/package.json').resolve('electron/package.json'))")
          ELECTRON_VERSION=$(node -p "require('${ELECTRON_DIR}/package.json').version")
          case "$(uname -m)" in
            x86_64) ELECTRON_ARCH=x64 ;;
            aarch64|arm64) ELECTRON_ARCH=arm64 ;;
            *) echo "Unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          ZIP="electron-v${ELECTRON_VERSION}-linux-${ELECTRON_ARCH}.zip"
          curl -fSL --retry 3 "https://github.com/electron/electron/releases/download/v${ELECTRON_VERSION}/${ZIP}" -o "/tmp/${ZIP}"
          curl -fSL --retry 3 "https://github.com/electron/electron/releases/download/v${ELECTRON_VERSION}/SHASUMS256.txt" -o /tmp/SHASUMS256.txt
          (cd /tmp && grep "${ZIP}\$" SHASUMS256.txt | sha256sum -c -)
          rm -rf "${ELECTRON_DIR}/dist" "${ELECTRON_DIR}/path.txt"
          unzip -q -o "/tmp/${ZIP}" -d "${ELECTRON_DIR}/dist"
          printf 'electron' > "${ELECTRON_DIR}/path.txt"
          test -x "${ELECTRON_DIR}/dist/electron"

      # ---------
      # Build
      # ---------

      - name: Install Native Build Dependencies (Linux Only)
        run: |
          sudo apt update
          sudo apt install -y liblzma-dev

      - run: pnpm run build:packages

      - name: Build (Linux Only) # Linux
        run: pnpm run -F @proj-airi/stage-tamagotchi build && pnpm -F @proj-airi/stage-tamagotchi exec electron-builder build ${{ matrix.builder-args }} --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Flatpak (Linux Only)
        run: |
          sudo apt update
          sudo apt install -y flatpak flatpak-builder elfutils
          flatpak --version
          flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build Flatpak (Linux Only) # Flatpak
        working-directory: ./apps/stage-tamagotchi
        run: |
          mkdir -p dist
          # Auto-install required SDK/Platform/BaseApp from Flathub in user scope
          flatpak-builder --user --install-deps-from=flathub ./flatpak ai.moeru.airi.dasilva333.flatpak.yml --force-clean
          flatpak build-export ./flatpak-repo ./flatpak
          export FLATPAK_OUTPUT_NAME=$(pnpm exec tsx scripts/artifacts-metadata.ts ${{ matrix.target }} --get-output-filename flatpak)
          flatpak build-bundle ./flatpak-repo dist/${FLATPAK_OUTPUT_NAME} ai.moeru.airi.dasilva333

      # ---------
      # Nightly (schedule) builds only
      # ---------

      - name: Get Artifacts Envs (Nightly)
        if: ${{ github.event_name == 'schedule' }}
        working-directory: ./apps/stage-tamagotchi
        run: |
          echo "VERSION=$(pnpm exec tsx scripts/artifacts-metadata.ts ${{ matrix.target }} --get-version)" >> $GITHUB_ENV

      - name: Rename Artifacts (Nightly)
        if: ${{ github.event_name == 'schedule' }}
        run:
          pnpm run -F @proj-airi/stage-tamagotchi rename-artifacts ${{ matrix.target }}

      - name: Get Linux Artifact Names (Nightly + Linux Only)
        if: ${{ github.event_name == 'schedule' }}
        working-directory: ./apps/stage-tamagotchi
        run: |
          echo "DEB_BUNDLE_NAME=$(pnpm exec tsx scripts/artifacts-metadata.ts ${{ matrix.target }} --get-filename deb)" >> $GITHUB_ENV
          echo "RPM_BUNDLE_NAME=$(pnpm exec tsx scripts/artifacts-metadata.ts ${{ matrix.target }} --get-filename rpm)" >> $GITHUB_ENV
          echo "FLATPAK_BUNDLE_NAME=$(pnpm exec tsx scripts/artifacts-metadata.ts ${{ matrix.target }} --get-filename flatpak)" >> $GITHUB_ENV

      - name: Upload Artifacts (Nightly + Linux deb)
        if: ${{ github.event_name == 'schedule' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DEB_BUNDLE_NAME }}
          path: apps/stage-tamagotchi/bundle/${{ env.DEB_BUNDLE_NAME }}

      - name: Upload Artifacts (Nightly + Linux rpm)
        if: ${{ github.event_name == 'schedule' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.RPM_BUNDLE_NAME }}
          path: apps/stage-tamagotchi/bundle/${{ env.RPM_BUNDLE_NAME }}

      - name: Upload Flatpak Artifact (Nightly + Linux Only)
        if: ${{ github.event_name == 'schedule' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.FLATPAK_BUNDLE_NAME }}
          path: apps/stage-tamagotchi/bundle/${{ env.FLATPAK_BUNDLE_NAME }}

      # ---------
      # Workflow Dispatch only
      # ---------

      - name: Get Artifacts Envs (Manual)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: ./apps/stage-tamagotchi
        run: |
          TAG_ARG=""
          if [ -n "${{ inputs.tag }}" ]; then
            TAG_ARG="--tag ${{ inputs.tag }}"
          fi
          echo "VERSION=$(pnpm exec tsx scripts/artifacts-metadata.ts ${{ matrix.target }} --get-version --release ${{ !inputs.build_only && !inputs.artifacts_only }} $TAG_ARG --auto-tag ${{ !inputs.build_only }})" >> $GITHUB_ENV

      - name: Rename Artifacts (Manual)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          TAG_ARG=""
          if [ -n "${{ inputs.tag }}" ]; then
            TAG_ARG="--tag ${{ inputs.tag }}"
          fi
          pnpm run -F @proj-airi/stage-tamagotchi rename-artifacts ${{ matrix.target }} --release ${{ !inputs.build_only && !inputs.artifacts_only }} $TAG_ARG --auto-tag ${{ !inputs.build_only }}

      - name: Get Linux Artifact Names (Manual + Non-Release + Linux Only)
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.build_only && inputs.artifacts_only }}
        working-directory: ./apps/stage-tamagotchi
        run: |
          TAG_ARG=""
          if [ -n "${{ inputs.tag }}" ]; then
            TAG_ARG="--tag ${{ inputs.tag }}"
          fi
          echo "DEB_BUNDLE_NAME=$(pnpm exec tsx scripts/artifacts-metadata.ts ${{ matrix.target }} --get-filename deb --release ${{ !inputs.build_only && !inputs.artifacts_only }} $TAG_ARG --auto-tag ${{ !inputs.build_only }})" >> $GITHUB_ENV
          echo "RPM_BUNDLE_NAME=$(pnpm exec tsx scripts/artifacts-metadata.ts ${{ matrix.target }} --get-filename rpm --release ${{ !inputs.build_only && !inputs.artifacts_only }} $TAG_ARG --auto-tag ${{ !inputs.build_only }})" >> $GITHUB_ENV
          echo "FLATPAK_BUNDLE_NAME=$(pnpm exec tsx scripts/artifacts-metadata.ts ${{ matrix.target }} --get-filename flatpak --release ${{ !inputs.build_only && !inputs.artifacts_only }} $TAG_ARG --auto-tag ${{ !inputs.build_only }})" >> $GITHUB_ENV

      - name: Upload Artifacts (Manual + Non-Release + Linux deb)
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.build_only && inputs.artifacts_only }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DEB_BUNDLE_NAME }}
          path: apps/stage-tamagotchi/bundle/${{ env.DEB_BUNDLE_NAME }}

      - name: Upload Artifacts (Manual + Non-Release + Linux rpm)
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.build_only && inputs.artifacts_only }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.RPM_BUNDLE_NAME }}
          path: apps/stage-tamagotchi/bundle/${{ env.RPM_BUNDLE_NAME }}

      - name: Upload Flatpak Artifact (Manual + Non-Release + Linux)
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.build_only && inputs.artifacts_only }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.FLATPAK_BUNDLE_NAME }}
          path: apps/stage-tamagotchi/bundle/${{ env.FLATPAK_BUNDLE_NAME }}

      - name: Upload To GitHub Releases (Manual + Release + Overwrite Release)
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.build_only && !inputs.artifacts_only }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/stage-tamagotchi/bundle/${{ env.PRODUCT_NAME }}-*.deb
            apps/stage-tamagotchi/bundle/${{ env.PRODUCT_NAME }}-*.rpm
            apps/stage-tamagotchi/bundle/${{ env.PRODUCT_NAME }}-*.flatpak
            apps/stage-tamagotchi/bundle/latest.yml
            apps/stage-tamagotchi/bundle/latest-*.yml
          append_body: true
          tag_name: ${{ inputs.tag != '' && inputs.tag || format('v{0}', env.VERSION) }}

      # ---------
      # Version push
      # ---------

      - name: Rename Artifacts (Automatic)
        if: ${{ github.event_name == 'release' }}
        run: |
          pnpm run -F @proj-airi/stage-tamagotchi rename-artifacts ${{ matrix.target }} --release --auto-tag

      - name: Upload To GitHub Releases (Automatic)
        if: ${{ github.event_name == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          # Possible auto updater files:
          # Linux: latest-linux-arm64.yml (arm64), latest-linux.yml (x64)
          files: |
            apps/stage-tamagotchi/bundle/${{ env.PRODUCT_NAME }}-*.deb
            apps/stage-tamagotchi/bundle/${{ env.PRODUCT_NAME }}-*.rpm
            apps/stage-tamagotchi/bundle/${{ env.PRODUCT_NAME }}-*.flatpak
            apps/stage-tamagotchi/bundle/latest.yml
            apps/stage-tamagotchi/bundle/latest-*.yml
          append_body: true
