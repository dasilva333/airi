name: 'Deploy: Frontends (Docs & Web Stage)'

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'apps/stage-web/**'
      - 'packages/**'
      - '.github/workflows/deploy-frontends.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile --ignore-scripts

      - run: pnpm run build:packages

      - name: Build docs
        run: pnpm -F @proj-airi/docs run build
        env:
          BASE_URL: /airi/

      - name: Build stage-web
        run: pnpm -F @proj-airi/stage-web run build
        env:
          BASE_URL: /airi/web-stage/

      - name: Bundle stage-web into docs distribution
        run: cp -r apps/stage-web/dist docs/.vitepress/dist/web-stage

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
