name: 'CI: Monorepo Verification'

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run lint
      - run: docker run -v `pwd`:`pwd` -w `pwd` ghcr.io/realm/swiftlint:latest
        working-directory: ./apps/stage-pocket

  build-test:
    name: Build Test (${{ matrix.app_name }})
    if: ${{ !(github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.label, 'moeru-ai:i18n/')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_name: stage-web
            command: pnpm -F @proj-airi/stage-web run build && pnpm -F @proj-airi/docs run build:base && mv ./docs/.vitepress/dist ./apps/stage-web/dist/docs && pnpm -F @proj-airi/stage-ui run story:build && mv ./packages/stage-ui/.histoire/dist ./apps/stage-web/dist/ui

          - app_name: stage-tamagotchi
            command: pnpm -F @proj-airi/stage-tamagotchi run build

          - app_name: ui-transitions
            command: pnpm -F @proj-airi/ui-transitions run play:build

          - app_name: ui-loading-screens
            command: pnpm -F @proj-airi/ui-loading-screens run play:build

    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - uses: actions/checkout@v6

      # Turborepo
      - name: Cache turbo build setup
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Provision Electron binary
        if: matrix.app_name == 'stage-tamagotchi'
        working-directory: ./apps/stage-tamagotchi
        run: |
          ELECTRON_DIR=$(node -p "require('node:path').dirname(require('node:module').createRequire(process.cwd() + '/package.json').resolve('electron/package.json'))")
          ELECTRON_VERSION=$(node -p "require('${ELECTRON_DIR}/package.json').version")
          case "$(uname -m)" in
            x86_64) ELECTRON_ARCH=x64 ;;
            aarch64|arm64) ELECTRON_ARCH=arm64 ;;
            *) echo "Unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          ZIP="electron-v${ELECTRON_VERSION}-linux-${ELECTRON_ARCH}.zip"
          curl -fSL --retry 3 "https://github.com/electron/electron/releases/download/v${ELECTRON_VERSION}/${ZIP}" -o "/tmp/${ZIP}"
          curl -fSL --retry 3 "https://github.com/electron/electron/releases/download/v${ELECTRON_VERSION}/SHASUMS256.txt" -o /tmp/SHASUMS256.txt
          (cd /tmp && grep "${ZIP}\$" SHASUMS256.txt | sha256sum -c -)
          rm -rf "${ELECTRON_DIR}/dist" "${ELECTRON_DIR}/path.txt"
          unzip -q -o "/tmp/${ZIP}" -d "${ELECTRON_DIR}/dist"
          printf 'electron' > "${ELECTRON_DIR}/path.txt"
          test -x "${ELECTRON_DIR}/dist/electron"
      - run: pnpm run build:packages

      - name: Build App
        run: ${{ matrix.command }}

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    if: ${{ !(github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.label, 'moeru-ai:i18n/')) }}
    steps:
      - uses: actions/checkout@v6

      # Node.js
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts
      # NOTICE: typecheck resolves workspace subpath exports from dist/
      # (e.g. @proj-airi/plugin-protocol/types). --ignore-scripts skips the
      # implicit postinstall build, so build explicitly first.
      - run: pnpm run build:packages
      - run: pnpm run typecheck

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    if: ${{ !(github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.label, 'moeru-ai:i18n/')) }}
    steps:
      - uses: actions/checkout@v6

      # Node.js
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Provision Electron binary
        working-directory: ./apps/stage-tamagotchi
        run: |
          ELECTRON_DIR=$(node -p "require('node:path').dirname(require('node:module').createRequire(process.cwd() + '/package.json').resolve('electron/package.json'))")
          ELECTRON_VERSION=$(node -p "require('${ELECTRON_DIR}/package.json').version")
          case "$(uname -m)" in
            x86_64) ELECTRON_ARCH=x64 ;;
            aarch64|arm64) ELECTRON_ARCH=arm64 ;;
            *) echo "Unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          ZIP="electron-v${ELECTRON_VERSION}-linux-${ELECTRON_ARCH}.zip"
          curl -fSL --retry 3 "https://github.com/electron/electron/releases/download/v${ELECTRON_VERSION}/${ZIP}" -o "/tmp/${ZIP}"
          curl -fSL --retry 3 "https://github.com/electron/electron/releases/download/v${ELECTRON_VERSION}/SHASUMS256.txt" -o /tmp/SHASUMS256.txt
          (cd /tmp && grep "${ZIP}\$" SHASUMS256.txt | sha256sum -c -)
          rm -rf "${ELECTRON_DIR}/dist" "${ELECTRON_DIR}/path.txt"
          unzip -q -o "/tmp/${ZIP}" -d "${ELECTRON_DIR}/dist"
          printf 'electron' > "${ELECTRON_DIR}/path.txt"
          test -x "${ELECTRON_DIR}/dist/electron"
      - run: pnpm run build:packages
      - run: pnpm run test:run

  check-provenance:
    name: Check Provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: danielroe/provenance-action@main
        id: check
        with:
          fail-on-provenance-change: true # optional, default: false
        #   lockfile: pnpm-lock.yaml      # optional
        #   base-ref: origin/main         # optional, default: origin/main
        #   fail-on-downgrade: true       # optional, default: true
      - name: Print result
        run: "echo 'Downgraded: ${{ steps.check.outputs.downgraded }}'"
